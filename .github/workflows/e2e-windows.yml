# 端對端測試（Windows 雲端機器）：
#   1. 用兩次打包（Build Lab Control、Build LabLogViewer）的安裝檔開一個測試用 Hub；
#   2. 執行 QELSetup（一鍵安裝）/VERYSILENT /HUB=測試 Hub：從 Hub 下載、安靜安裝兩個程式；
#   3. 裝好的 Lab Control、LabLogViewer 各跑一次 --self-test；
#   4. LabLogViewer 的去背景（.nc 與 Labber）在 Windows 上跑測試（[Errno 9] 的修正）。
name: E2E Windows

on:
  workflow_dispatch:
    inputs:
      lc_run:
        description: "Build Lab Control 那次的 run id"
        required: true
      llv_run:
        description: "Build LabLogViewer 那次的 run id"
        required: true

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.lc_run }}
          github-token: ${{ github.token }}
          name: LabControl-windows
          path: files
      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.llv_run }}
          github-token: ${{ github.token }}
          name: LabLogViewer-Windows-installer
          path: files
      - name: Test Hub with the installers
        shell: pwsh
        run: |
          Get-ChildItem files
          $setups = Get-ChildItem files -Filter "*-setup.exe" | ForEach-Object { $_.FullName }
          $boot = (Get-ChildItem files -Filter "QELSetup_*.exe").FullName
          $args = @("LabControl/tools/serve_test_hub.py", "$env:RUNNER_TEMP\hub", "18765") + $setups + @($boot)
          Start-Process python -ArgumentList $args -RedirectStandardOutput hub.log -RedirectStandardError hub.err -NoNewWindow
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; if ((Get-Content hub.log -Raw) -match "ready") { break } }
          Get-Content hub.log
          (Invoke-WebRequest http://127.0.0.1:18765/get/setup.txt -UseBasicParsing).Content
      - name: One-click setup (silent) from the Hub
        shell: pwsh
        run: |
          $boot = (Get-ChildItem files -Filter "QELSetup_*.exe").FullName
          $p = Start-Process $boot -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/HUB=http://127.0.0.1:18765", "/LOG=$PWD\qelsetup.log" -Wait -PassThru
          Get-Content qelsetup.log -Tail 40
          if ($p.ExitCode -ne 0) { throw "QELSetup exit code $($p.ExitCode)" }
          $lc = "$env:LOCALAPPDATA\Programs\Lab Control\LabControl.exe"
          $llv = "$env:LOCALAPPDATA\Programs\LabLogViewer\LabLogViewer.exe"
          if (-not (Test-Path $lc)) { throw "Lab Control not installed" }
          if (-not (Test-Path $llv)) { throw "LabLogViewer not installed" }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Lab Control" | Select-Object -First 10
      - name: Installed Lab Control --self-test
        shell: pwsh
        run: |
          $env:LABCONTROL_SELF_TEST_REPORT = "$env:RUNNER_TEMP\lc_self_test.txt"
          $env:LABCONTROL_NO_UPDATE_CHECK = "1"
          $p = Start-Process "$env:LOCALAPPDATA\Programs\Lab Control\LabControl.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content $env:LABCONTROL_SELF_TEST_REPORT
          if ($p.ExitCode -ne 0) { throw "Lab Control self-test failed" }
      - name: Installed LabLogViewer --self-test
        shell: pwsh
        run: |
          $env:LABLOGVIEWER_SELF_TEST_REPORT = "$env:RUNNER_TEMP\llv_self_test.txt"
          $p = Start-Process "$env:LOCALAPPDATA\Programs\LabLogViewer\LabLogViewer.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content $env:LABLOGVIEWER_SELF_TEST_REPORT
          if ($p.ExitCode -ne 0) { throw "LabLogViewer self-test failed" }
      - name: Second run updates in place (same folders)
        shell: pwsh
        run: |
          $boot = (Get-ChildItem files -Filter "QELSetup_*.exe").FullName
          $p = Start-Process $boot -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/HUB=http://127.0.0.1:18765" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "second QELSetup run failed" }
          (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory).Name

  llv-windows-tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LabLogViewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install --disable-pip-version-check -r packaging/requirements-build.txt pytest xarray h5netcdf
      - name: De-background, .nc, metadata, Measurement interface (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests/test_v015b_debackground.py tests/test_v210_labcontrol_nc.py tests/test_v213_browser_metadata.py tests/test_v212_hub_update.py
