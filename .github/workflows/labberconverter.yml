# Labber 轉換工具（LabberConverter/）→ Windows 單一 exe：LabberConverter_v<版本>_windows.exe（版本 = converter.py 的 VERSION）。
# 手動執行（Actions > Build Labber Converter > Run workflow）會建立 / 更新 GitHub 發佈 labberconverter-v<版本>。
# 打包後用 LABBER_CONVERTER_SMOKE_DIR 開一次介面並在 exe 裡實際轉一個小檔（ready.txt 要寫 conversion ok）。
name: Build Labber Converter

on:
  workflow_dispatch:
    inputs:
      release:
        description: "建立 GitHub 發佈 labberconverter-v<版本>"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["LabberConverter/**", ".github/workflows/labberconverter.yml"]

permissions:
  contents: write

defaults:
  run:
    working-directory: LabberConverter
    shell: pwsh

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Version
        id: v
        run: |
          $v = (Select-String -Path converter.py -Pattern 'VERSION\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        run: |
          $name = "LabberConverter_v${{ steps.v.outputs.version }}_windows"
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name $name --icon assets\icon.ico --add-data "assets\icon.png;assets" --exclude-module scipy --exclude-module matplotlib --exclude-module pandas --exclude-module IPython app.py
          if (-not (Test-Path "dist/$name.exe")) { throw "沒有產生 exe" }
      - name: Smoke test (open the window and convert one file inside the exe)
        run: |
          $dir = "$env:RUNNER_TEMP\lc_smoke"
          $env:LABBER_CONVERTER_SMOKE_DIR = $dir
          $p = Start-Process -FilePath "dist/LabberConverter_v${{ steps.v.outputs.version }}_windows.exe" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "exe 180 秒沒結束" }
          $ready = Get-Content "$dir\ready.txt" -Raw -ErrorAction SilentlyContinue
          Write-Output "exit $($p.ExitCode)`n$ready"
          if (-not ($ready -match "conversion ok")) { throw "exe 裡的轉換沒有成功：$ready" }
          Write-Output "::notice title=smoke::$($ready -replace "`r?`n", ' | ')"
      - uses: actions/upload-artifact@v5
        with:
          name: LabberConverter-windows
          path: LabberConverter/dist/LabberConverter_v${{ steps.v.outputs.version }}_windows.exe
          retention-days: 14
      - name: GitHub release labberconverter-v${{ steps.v.outputs.version }}
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $tag = "labberconverter-v$v"
          $exe = "dist/LabberConverter_v${v}_windows.exe"
          Set-Content -Path notes.md -Value "Labber 轉換工具 $v（Windows 單一 exe）：Lab Control 的 .nc → Labber data log，並建立 / 合併 Database.hdf5。詳見 LabberConverter/README.md。" -Encoding utf8
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $exe --clobber }
          else { gh release create $tag $exe --title "Labber 轉換工具 $v" --notes-file notes.md --target $env:GITHUB_SHA }
