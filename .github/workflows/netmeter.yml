# QEL 流量監看（NetMeter/）→ QELNetMeter_v<版本>_windows.exe、QELNetMeter_v<版本>_macos-<晶片>.dmg
# 手動執行（Actions > Build NetMeter > Run workflow）會建立 / 更新 GitHub 發佈 netmeter-v<版本>；
# 平台控制台「從 GitHub 取得新版」就拿得到（Hub 1.0.30 起）。改了 NetMeter/ 推到 main 只打包檢查。
name: Build NetMeter

on:
  workflow_dispatch:
    inputs:
      release:
        description: "建立 GitHub 發佈 netmeter-v<版本>"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["NetMeter/**", ".github/workflows/netmeter.yml"]

permissions:
  contents: write

defaults:
  run:
    working-directory: NetMeter

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    defaults:
      run:
        shell: pwsh
        working-directory: NetMeter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Version
        id: v
        run: |
          $v = (Select-String -Path netmeter/__init__.py -Pattern '__version__ = "([0-9.]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        run: |
          pyinstaller --noconfirm --log-level WARN packaging/netmeter.spec
          $v = "${{ steps.v.outputs.version }}"
          Move-Item dist/QELNetMeter.exe "dist/QELNetMeter_v${v}_windows.exe"
          Get-ChildItem dist -File | Format-Table Name, Length
      - name: Self-test (packaged exe)
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $out = "$env:RUNNER_TEMP\netmeter_selftest.txt"
          $env:QELNETMETER_HOME = "$env:RUNNER_TEMP\nm_home"
          $p = Start-Process -FilePath "dist/QELNetMeter_v${v}_windows.exe" -ArgumentList '--self-test', '--out', "`"$out`"" -PassThru
          if (-not $p.WaitForExit(120000)) { throw "self-test 120 秒沒結束" }
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "self-test 失敗（$($p.ExitCode)）" }
      - name: Install, agent reports, update, uninstall (end to end)
        timeout-minutes: 5
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $env:QELNETMETER_HOME = "$env:RUNNER_TEMP\nm_e2e"
          New-Item -ItemType Directory -Force $env:QELNETMETER_HOME | Out-Null
          # 假的 Hub：記下回報；runner 的網段當成「實驗室網段」
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          '{"subnets": ["' + $ip + '/32"], "hubs": ["http://127.0.0.1:18765"], "sample_s": 1, "report_s": 1}' | Set-Content "$env:QELNETMETER_HOME\config.json" -Encoding utf8
          $hubpy = "$env:RUNNER_TEMP\fake_hub.py"
          @(
            'import http.server, pathlib, sys',
            'log = pathlib.Path(sys.argv[1])',
            'class H(http.server.BaseHTTPRequestHandler):',
            '    def do_POST(self):',
            '        b = self.rfile.read(int(self.headers["Content-Length"]))',
            '        with log.open("a", encoding="utf-8") as f: f.write(b.decode() + "\n")',
            '        self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()',
            '        self.wfile.write(b"{\"ok\": true}")',
            '    def do_GET(self):',
            '        self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()',
            '        self.wfile.write(b"{\"apps\": []}")',
            '    def log_message(self, *a): pass',
            'http.server.ThreadingHTTPServer(("127.0.0.1", 18765), H).serve_forever()'
          ) | Set-Content $hubpy -Encoding utf8
          $reports = "$env:RUNNER_TEMP\hub_reports.txt"
          $hub = Start-Process python -ArgumentList "`"$hubpy`"", "`"$reports`"" -PassThru
          Start-Sleep -Seconds 2
          # 雙擊 = 安裝＋背景程式＋視窗；CI 用 --install（同一條路、不開視窗）。不能用 -Wait（會連背景程式一起等）
          $p = Start-Process -FilePath "dist/QELNetMeter_v${v}_windows.exe" -ArgumentList '--install' -PassThru
          if (-not $p.WaitForExit(60000)) { throw "--install 60 秒沒結束" }
          $installed = "$env:QELNETMETER_HOME\QELNetMeter.exe"
          if (-not (Test-Path $installed)) { throw "沒有複製到 $installed" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').QELNetMeter
          if ($run -notmatch '--agent') { throw "沒有登記開機自動啟動：$run" }
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path $reports) -and (Get-Content $reports | Select-String '"id": "nm-')) { $ok = $true; break } }
          if (-not $ok) { Get-Content "$env:QELNETMETER_HOME\netmeter.log" -ErrorAction SilentlyContinue; throw "背景程式沒有回報到 Hub" }
          Get-Content $reports | Select-Object -Last 1
          $p = Start-Process -FilePath $installed -ArgumentList '--uninstall' -PassThru
          if (-not $p.WaitForExit(30000)) { throw "--uninstall 30 秒沒結束" }
          Start-Sleep -Seconds 2
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).QELNetMeter
          if ($run) { throw "解除安裝後還有自動啟動" }
          if (Get-CimInstance Win32_Process -Filter "Name = 'QELNetMeter.exe'") { throw "解除安裝後背景程式還在" }
          Stop-Process -Id $hub.Id -Force
          Write-Output "::notice title=end to end::installed, reported to hub, uninstalled"
      - uses: actions/upload-artifact@v5
        with:
          name: NetMeter-windows
          path: NetMeter/dist/QELNetMeter_v*_windows.exe
          retention-days: 14

  mac:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Build, self-test, dmg
        run: |
          test "$(python -c 'import platform;print(platform.machine())')" = "${{ matrix.arch }}"
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('netmeter/__init__.py').read()).group(1))")
          pyinstaller --noconfirm --log-level WARN packaging/netmeter.spec
          codesign --force --deep --sign - dist/QELNetMeter.app
          QELNETMETER_HOME="$RUNNER_TEMP/nm_home" dist/QELNetMeter.app/Contents/MacOS/QELNetMeter --self-test --out "$RUNNER_TEMP/st.txt" || { cat "$RUNNER_TEMP/st.txt"; exit 1; }
          cat "$RUNNER_TEMP/st.txt"
          stage=$(mktemp -d)
          cp -R dist/QELNetMeter.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "QEL 流量監看" -srcfolder "$stage" -ov -format UDZO "dist/QELNetMeter_v${v}_macos-${{ matrix.arch }}.dmg"
          ls -l dist/*.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: NetMeter-macos-${{ matrix.arch }}
          path: NetMeter/dist/QELNetMeter_v*_macos-*.dmg
          retention-days: 14

  release:
    name: GitHub release
    needs: [windows, mac]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Create / update release netmeter-v${{ needs.windows.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.windows.outputs.version }}"
          tag="netmeter-v$v"
          notes=$(awk -v v="$v" '$0 ~ "^### v"v"$"{f=1;next} /^##/{f=0} f' NetMeter/README.md)
          printf 'QEL 流量監看 %s（Windows .exe、macOS .dmg）\n\n%s\n' "$v" "$notes" > notes.md
          ls -l out
          if gh release view "$tag" >/dev/null 2>&1; then gh release upload "$tag" out/* --clobber
          else gh release create "$tag" out/* --title "QEL 流量監看 $v" --notes-file notes.md --target "$GITHUB_SHA"; fi
