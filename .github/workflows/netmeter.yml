# QEL 流量監看（NetMeter/）→ QELNetMeter_v<版本>_windows.exe、QELNetMeter_v<版本>_macos-<晶片>.dmg
# 手動執行（Actions > Build NetMeter > Run workflow）會建立 / 更新 GitHub 發佈 netmeter-v<版本>；
# 平台控制台「從 GitHub 取得新版」就拿得到（Hub 1.0.30 起）。改了 NetMeter/ 推到 main 只打包檢查。
name: Build NetMeter

on:
  workflow_dispatch:
    inputs:
      release:
        description: "建立 GitHub 發佈 netmeter-v<版本>"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["NetMeter/**", ".github/workflows/netmeter.yml"]

permissions:
  contents: write

defaults:
  run:
    working-directory: NetMeter

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    defaults:
      run:
        shell: pwsh
        working-directory: NetMeter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Version
        id: v
        run: |
          $v = (Select-String -Path netmeter/__init__.py -Pattern '__version__ = "([0-9.]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build (folder) and installer
        run: |
          $v = "${{ steps.v.outputs.version }}"
          pyinstaller --noconfirm --log-level WARN packaging/netmeter.spec
          if (-not (Test-Path "dist/QELNetMeter/QELNetMeter.exe")) { throw "沒有產生 dist/QELNetMeter/QELNetMeter.exe" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          iscc "/DAppVersion=$v" packaging/installer.iss
          if (-not (Test-Path "dist/QELNetMeter_v${v}_windows-setup.exe")) { throw "沒有產生安裝程式" }
          Get-ChildItem dist -File | Format-Table Name, Length
          (Get-Item "dist/QELNetMeter/QELNetMeter.exe").VersionInfo | Format-List CompanyName, FileDescription, ProductVersion
      - name: Silent install, self-test, agent reports, uninstall (end to end)
        timeout-minutes: 8
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $dir = "$env:RUNNER_TEMP\nm_app"
          # 1.0.3：背景程式由系統排程以 SYSTEM 執行，設定 / 紀錄在 %ProgramData%\QELNetMeter（不吃 QELNETMETER_HOME）
          $home_ = "$env:ProgramData\QELNetMeter"
          New-Item -ItemType Directory -Force $home_ | Out-Null
          # 假的 Hub：記下回報；runner 的位址當成「實驗室網段」
          # 預設路由那張網卡（不是 Hyper-V 的 vEthernet）：分內網 / 外網要看得到對外的流量
          $idx = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object { $_.RouteMetric + $_.InterfaceMetric } | Select-Object -First 1).ifIndex
          $ip = (Get-NetIPAddress -AddressFamily IPv4 -InterfaceIndex $idx | Select-Object -First 1).IPAddress
          Write-Output "lab ip: $ip (ifIndex $idx)"
          # 127.0.0.1 也當實驗室網段：假 Hub 在 127.0.0.1，回報時給 https 網域 → hosts 要把它指到 127.0.0.1
          '{"subnets": ["' + $ip + '/32", "127.0.0.1/32"], "hubs": ["http://127.0.0.1:18765"], "sample_s": 1, "report_s": 1}' | Set-Content "$home_\config.json" -Encoding utf8
          $hubpy = "$env:RUNNER_TEMP\fake_hub.py"
          @(
            'import http.server, pathlib, sys',
            'log = pathlib.Path(sys.argv[1])',
            'class H(http.server.BaseHTTPRequestHandler):',
            '    def do_POST(self):',
            '        b = self.rfile.read(int(self.headers["Content-Length"]))',
            '        with log.open("a", encoding="utf-8") as f: f.write(b.decode() + "\n")',
            '        self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()',
            '        self.wfile.write(b"{\"ok\": true, \"lan_https\": {\"domain\": \"qel-ci.example.ts.net\", \"url\": \"https://qel-ci.example.ts.net:8443\"}}")',
            '    def do_GET(self):',
            '        self.send_response(200); self.send_header("Content-Type", "application/json"); self.end_headers()',
            '        self.wfile.write(b"{\"apps\": []}")',
            '    def log_message(self, *a): pass',
            'http.server.ThreadingHTTPServer(("127.0.0.1", 18765), H).serve_forever()'
          ) | Set-Content $hubpy -Encoding utf8
          $reports = "$env:RUNNER_TEMP\hub_reports.txt"
          $hub = Start-Process python -ArgumentList "`"$hubpy`"", "`"$reports`"" -PassThru
          Start-Sleep -Seconds 2
          # 安靜安裝（跟自動更新一樣）；不能用 -Wait（會連背景程式一起等）
          $p = Start-Process -FilePath "dist/QELNetMeter_v${v}_windows-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"" -PassThru
          if (-not $p.WaitForExit(120000)) { throw "安裝 120 秒沒結束" }
          if ($p.ExitCode -ne 0) { throw "安裝失敗（$($p.ExitCode)）" }
          foreach ($f in "QELNetMeter.exe", "unins000.exe") { if (-not (Test-Path "$dir\$f")) { throw "安裝後沒有 $f" } }
          schtasks /Query /TN "QEL\NetMeter" /XML | Out-String | Tee-Object -Variable task | Select-String -Pattern 'BootTrigger|S-1-5-18|--agent'
          if ($LASTEXITCODE -ne 0 -or $task -notmatch 'BootTrigger' -or $task -notmatch 'S-1-5-18' -or $task -notlike "*$dir*") { throw "沒有建立開機自動啟動的系統排程" }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).QELNetMeter) { throw "還留著舊的登入自動啟動" }
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if ((Test-Path $reports) -and (Get-Content $reports | Select-String '"id": "nm-')) { $ok = $true; break } }
          if (-not $ok) { Get-Content "$home_\netmeter.log" -ErrorAction SilentlyContinue; schtasks /Query /TN "QEL\NetMeter" /V /FO LIST; throw "背景程式沒有回報到 Hub" }
          Get-Content $reports | Select-Object -Last 1
          # 1.0.4：內網 https —— hosts 有「網域 → Hub 位址」
          $hosts = "$env:SystemRoot\System32\drivers\etc\hosts"
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) { Start-Sleep -Milliseconds 500; if (Select-String -Path $hosts -Pattern '^127\.0\.0\.1 qel-ci\.example\.ts\.net$' -Quiet) { $ok = $true; break } }
          if (-not $ok) { Get-Content $hosts; Get-Content "$home_\netmeter.log" -ErrorAction SilentlyContinue; throw "hosts 沒有 Hub 的 https 網域" }
          # 1.0.4：分內網 / 外網 —— 從外面下載一些東西，回報裡要有 wan_down
          for ($i = 0; $i -lt 3; $i++) { Invoke-WebRequest -UseBasicParsing "https://api.github.com/repos/python/cpython" -Headers @{"User-Agent" = "ci"} | Out-Null }
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            $last = Get-Content $reports | Select-Object -Last 1
            if ($last -match '"wan_down": [1-9]') { $ok = $true; break } }
          if (-not $ok) { $last; Get-Content "$home_\netmeter.log" -ErrorAction SilentlyContinue; throw "沒有分出外網的流量（ETW）" }
          Write-Output ($last -replace '.*"days": ', 'days: ')
          # 背景程式是 SYSTEM 跑的（不是安裝程式的子程序）
          $owner = Get-CimInstance Win32_Process -Filter "Name = 'QELNetMeter.exe'" | Where-Object { $_.CommandLine -match '--agent' } | ForEach-Object { (Invoke-CimMethod -InputObject $_ -MethodName GetOwner).User }
          Write-Output "agent runs as: $owner"
          if ($owner -notcontains 'SYSTEM') { throw "背景程式不是由系統排程（SYSTEM）啟動：$owner" }
          # 背景程式被關掉 → 系統排程（每 10 分鐘）會再開；這裡直接叫排程跑一次確認可以重開
          Get-CimInstance Win32_Process -Filter "Name = 'QELNetMeter.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep -Seconds 2
          schtasks /Run /TN "QEL\NetMeter" | Out-Null
          Start-Sleep -Seconds 5
          if (-not (Get-CimInstance Win32_Process -Filter "Name = 'QELNetMeter.exe'" | Where-Object { $_.CommandLine -match '--agent' })) { throw "系統排程沒辦法重新啟動背景程式" }
          $env:QELNETMETER_HOME = "$env:RUNNER_TEMP\nm_e2e"
          $env:NETMETER_SELFTEST_FLOWS = "1"
          New-Item -ItemType Directory -Force $env:QELNETMETER_HOME | Out-Null
          # 安裝好的程式自我檢查
          $out = "$env:RUNNER_TEMP\netmeter_selftest.txt"
          $st = Start-Process -FilePath "$dir\QELNetMeter.exe" -ArgumentList '--self-test', '--out', "`"$out`"" -PassThru
          if (-not $st.WaitForExit(120000)) { throw "self-test 120 秒沒結束" }
          Get-Content $out -Encoding utf8
          if ($st.ExitCode -ne 0) { throw "self-test 失敗（$($st.ExitCode)）" }
          # 再裝一次（模擬自動更新：舊的背景程式要先結束、裝完再啟動）
          $p = Start-Process -FilePath "dist/QELNetMeter_v${v}_windows-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"" -PassThru
          if (-not $p.WaitForExit(120000) -or $p.ExitCode -ne 0) { throw "重新安裝失敗" }
          Start-Sleep -Seconds 4
          if (-not (Get-CimInstance Win32_Process -Filter "Name = 'QELNetMeter.exe'" | Where-Object { $_.CommandLine -match '--agent' })) { throw "重新安裝後背景程式沒有啟動" }
          # 解除安裝
          $p = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $p.WaitForExit(120000)) { throw "解除安裝 120 秒沒結束" }
          Start-Sleep -Seconds 4
          schtasks /Query /TN "QEL\NetMeter" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "解除安裝後系統排程還在" }
          $global:LASTEXITCODE = 0
          if (Get-CimInstance Win32_Process -Filter "Name = 'QELNetMeter.exe'") { throw "解除安裝後背景程式還在" }
          if (Select-String -Path $hosts -Pattern 'QEL NetMeter|qel-ci' -Quiet) { Get-Content $hosts; throw "解除安裝後 hosts 還留著 Hub 網域" }
          Stop-Process -Id $hub.Id -Force
          Write-Output "::notice title=end to end::installed silently, boot task as SYSTEM, reported to hub, hosts entry, LAN/WAN split, restarted by task, reinstalled, uninstalled"
      - uses: actions/upload-artifact@v5
        with:
          name: NetMeter-windows
          path: NetMeter/dist/QELNetMeter_v*_windows-setup.exe
          retention-days: 14

  mac:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3 pytest
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Build, self-test, dmg
        run: |
          test "$(python -c 'import platform;print(platform.machine())')" = "${{ matrix.arch }}"
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('netmeter/__init__.py').read()).group(1))")
          pyinstaller --noconfirm --log-level WARN packaging/netmeter.spec
          codesign --force --deep --sign - dist/QELNetMeter.app
          QELNETMETER_HOME="$RUNNER_TEMP/nm_home" NETMETER_SELFTEST_FLOWS=1 dist/QELNetMeter.app/Contents/MacOS/QELNetMeter --self-test --out "$RUNNER_TEMP/st.txt" || { cat "$RUNNER_TEMP/st.txt"; exit 1; }
          cat "$RUNNER_TEMP/st.txt"
          stage=$(mktemp -d)
          cp -R dist/QELNetMeter.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "QEL 流量監看" -srcfolder "$stage" -ov -format UDZO "dist/QELNetMeter_v${v}_macos-${{ matrix.arch }}.dmg"
          ls -l dist/*.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: NetMeter-macos-${{ matrix.arch }}
          path: NetMeter/dist/QELNetMeter_v*_macos-*.dmg
          retention-days: 14

  release:
    name: GitHub release
    needs: [windows, mac]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Create / update release netmeter-v${{ needs.windows.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.windows.outputs.version }}"
          tag="netmeter-v$v"
          notes=$(awk -v v="$v" '$0 ~ "^### v"v"$"{f=1;next} /^##/{f=0} f' NetMeter/README.md)
          printf 'QEL 流量監看 %s（Windows .exe、macOS .dmg）\n\n%s\n' "$v" "$notes" > notes.md
          ls -l out
          if gh release view "$tag" >/dev/null 2>&1; then gh release upload "$tag" out/* --clobber
          else gh release create "$tag" out/* --title "QEL 流量監看 $v" --notes-file notes.md --target "$GITHUB_SHA"; fi
