<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub 控制台</title>
<style>
  :root {
    --bg:#f4f6f9; --surface:#ffffff; --surface2:#f8fafc; --border:#e3e7ee; --strong:#cfd6e0;
    --text:#1f2937; --muted:#6b7280; --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
    --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#16181d; --surface:#1d2026; --surface2:#23262d; --border:#2c3038; --strong:#3a3f48;
      --text:#e6e8eb; --muted:#8b93a1; --accent:#3b82f6; --accent-soft:rgba(59,130,246,.15);
      --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 "Segoe UI","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:16px 24px; background:var(--surface);
           border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:.3px; }
  header .sub { color:var(--muted); font-size:12px; }
  header .sp { flex:1; }
  header a { color:var(--muted); text-decoration:none; font-size:13px; }
  main { max-width:1080px; margin:0 auto; padding:20px 16px 48px; display:grid; gap:16px;
         grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; min-width:0; }
  .card h2 { margin:0 0 12px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .card h2 .n { color:var(--muted); font-weight:400; font-size:12px; }
  .wide { grid-column:1 / -1; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; }
  .kv div:nth-child(odd) { color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:6px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.ok { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent); }
  .dot.err { background:var(--err); }
  .dot.warn { background:var(--warn); }
  button { font:inherit; font-size:14px; padding:8px 16px; border-radius:8px; border:1px solid var(--strong);
           background:var(--surface2); color:var(--text); cursor:pointer; transition:.15s; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.primary:hover:not(:disabled) { filter:brightness(1.1); }
  button.danger { color:var(--err); border-color:color-mix(in srgb,var(--err) 60%,transparent); background:transparent; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .drop { border:1.5px dashed var(--strong); border-radius:10px; padding:18px; text-align:center; color:var(--muted);
          cursor:pointer; transition:.15s; margin-bottom:12px; }
  .drop.over, .drop:hover { border-color:var(--accent); background:var(--accent-soft); color:var(--text); }
  .drop b { color:var(--text); }
  input[type=file] { display:none; }
  .steps { list-style:none; margin:0; padding:0; }
  .steps li { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:start; padding:9px 0;
              border-bottom:1px solid var(--border); }
  .steps li:last-child { border-bottom:0; }
  .ic { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700;
        border:1.5px solid var(--strong); color:var(--muted); }
  .ic.running { border-color:var(--accent); color:var(--accent); }
  .ic.running::after { content:""; width:12px; height:12px; border-radius:50%; border:2px solid var(--accent);
                       border-top-color:transparent; animation:spin .8s linear infinite; }
  .ic.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .ic.fail { background:var(--err); border-color:var(--err); color:#fff; }
  .ic.skip { opacity:.4; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .st-title { font-weight:600; }
  .st-msg { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .st-t { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .result { margin-top:12px; padding:10px 12px; border-radius:8px; font-weight:600; display:none; }
  .result.ok { display:block; background:color-mix(in srgb,var(--ok) 14%,transparent); color:var(--ok); }
  .result.fail { display:block; background:color-mix(in srgb,var(--err) 14%,transparent); color:var(--err); }
  pre { margin:0; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
        font:12px/1.5 ui-monospace,Consolas,monospace; max-height:280px; overflow:auto; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:7px 6px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .muted { color:var(--muted); }
  .banner { grid-column:1/-1; display:none; padding:10px 14px; border-radius:8px; color:var(--err);
            border:1px solid var(--err); background:color-mix(in srgb,var(--err) 10%,transparent); }
</style>
</head>
<body>
<header>
  <div><h1>Hub 控制台</h1><div class="sub">停止 · 備份 · 換程式 · 重建 · 啟動 · 確認版本</div></div>
  <span class="sp"></span>
  <span class="chip" id="hubchip"><i class="dot"></i>連線中…</span>
  <a href="/logout">登出</a>
</header>
<main>
  <div class="banner" id="banner">與控制代理的連線中斷（可能正在重新啟動），重新連線中…</div>

  <section class="card">
    <h2>狀態</h2>
    <div class="kv" id="status"></div>
  </section>

  <section class="card">
    <h2>更新網站</h2>
    <label class="drop" id="drop"><input type="file" id="file" accept=".zip">
      <div id="droptext"><b>選擇新版 zip</b>（或拖曳到這裡）<br><span class="muted">LabControlHub_v*.zip 或 LabControl_v*.zip，不需要解壓縮</span></div>
    </label>
    <div class="row">
      <button class="primary" id="b-update" disabled>⬆ 更新網站</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button data-act="full_rebuild">完全重建</button>
      <button data-act="restart">重新啟動網站</button>
      <button data-act="start">啟動</button>
      <button class="danger" data-act="stop">停止</button>
    </div>
  </section>

  <section class="card wide">
    <h2>進度 <span class="n" id="jobtitle">（還沒有執行）</span></h2>
    <ul class="steps" id="steps"></ul>
    <div class="result" id="result"></div>
  </section>

  <section class="card">
    <h2>紀錄</h2>
    <pre id="log">—</pre>
  </section>

  <section class="card">
    <h2>備份 <span class="n">每次更新前自動備份</span></h2>
    <table><thead><tr><th>版本</th><th>時間</th><th></th></tr></thead><tbody id="backups"></tbody></table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON = {ok:"✔", fail:"✖", skip:"–", pending:"", running:""};
let file = null, job = null, after = 0, busy = false, logLines = [];

async function api(path, opts) {
  const r = await fetch(path, Object.assign({credentials:"same-origin"}, opts || {}));
  if (r.status === 401) { location.href = "/login"; throw new Error("401"); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

function setBusy(b) {
  busy = b;
  document.querySelectorAll("button").forEach(x => x.disabled = b || (x.id === "b-update" && !file));
}

function renderJob(j) {
  $("jobtitle").textContent = `${j.title}${j.by ? "（" + j.by + "）" : ""} · ${new Date(j.started*1000).toLocaleTimeString()}`;
  $("steps").innerHTML = j.steps.map(s => {
    const t = s.t0 ? (((s.t1 || Date.now()/1000) - s.t0).toFixed(1) + " s") : "";
    return `<li><span class="ic ${s.status}">${ICON[s.status] || ""}</span>
      <div><div class="st-title">${esc(s.title)}</div><div class="st-msg">${esc(s.msg)}</div></div>
      <span class="st-t">${s.status === "pending" ? "" : t}</span></li>`;
  }).join("");
  for (const l of j.lines) logLines.push(`${new Date(l.time*1000).toLocaleTimeString()}  ${l.msg}`);
  $("log").textContent = logLines.slice(-300).join("\n") || "—";
  $("log").scrollTop = 1e9;
  const r = $("result");
  r.className = "result" + (j.done ? (j.ok ? " ok" : " fail") : "");
  r.textContent = j.done ? j.result : "";
}

async function follow(id) {
  job = id; after = 0; logLines = [];
  setBusy(true);
  while (true) {
    let j;
    try { j = await api(`/api/agent/jobs/${id}?after=${after}&wait=20`); $("banner").style.display = "none"; }
    catch (e) { $("banner").style.display = "block"; await new Promise(r => setTimeout(r, 2000)); continue; }
    after = j.n_lines;
    renderJob(j);
    if (j.done) break;
  }
  setBusy(false);
  refresh();
}

async function run(action, body) {
  const labels = {full_rebuild:"完全重建", restart:"重新啟動網站", stop:"停止", start:"啟動", update:"更新網站"};
  if (action === "stop" && !confirm("停止 Hub？停止期間所有電腦都連不到 Hub。")) return;
  if (action === "full_rebuild" && !confirm("完全重建會重新下載基礎映像（約 1 分鐘），確定？")) return;
  try {
    const j = await api(`/api/agent/jobs?action=${action}&by=${encodeURIComponent("網頁控制台")}`,
      {method:"POST", headers:{"Content-Type": body ? "application/zip" : "application/json"}, body: body || "{}"});
    follow(j.id);
  } catch (e) { alert(`${labels[action]}失敗：${e.message}`); }
}

function pick(f) {
  if (!f) return;
  if (!/\.zip$/i.test(f.name)) { alert("請選 .zip 檔"); return; }
  file = f;
  $("droptext").innerHTML = `<b>${esc(f.name)}</b><br><span class="muted">${(f.size/1024).toFixed(0)} KB · 按「更新網站」開始</span>`;
  setBusy(busy);
}

$("file").onchange = e => pick(e.target.files[0]);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); };
$("b-update").onclick = async () => { if (file) run("update", await file.arrayBuffer()); };
document.querySelectorAll("button[data-act]").forEach(b => b.onclick = () => run(b.dataset.act));

async function rollback(name, v) {
  if (!confirm(`回到備份 v${v}（${name}）？`)) return;
  try {
    const j = await api(`/api/agent/jobs?action=rollback&backup=${encodeURIComponent(name)}&by=${encodeURIComponent("網頁控制台")}`,
      {method:"POST", body:"{}"});
    follow(j.id);
  } catch (e) { alert(`失敗：${e.message}`); }
}

async function refresh() {
  try {
    const s = await api("/api/agent");
    $("banner").style.display = "none";
    const c = s.container || {};
    const running = c.status === "running";
    $("hubchip").innerHTML = `<i class="dot ${s.hub_online ? "ok" : running ? "warn" : "err"}"></i>` +
      (s.hub_online ? `Hub v${esc(s.hub_version)} 運作中` : running ? "Hub 容器執行中，網站沒有回應" : "Hub 已停止");
    $("status").innerHTML = [
      ["Hub 網站", s.hub_online ? `✔ v${esc(s.hub_version)}` : "✖ 沒有回應"],
      ["容器", `${esc(c.name)} · ${esc(c.status || "?")}${c.id ? " · " + esc(c.id) : ""}`],
      ["映像", esc(c.image || "—")],
      ["程式資料夾", `v${esc(s.code_version || "?")} · ${esc(s.hub_dir)}`],
      ["控制代理", `v${esc(s.agent_version)}`],
    ].map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join("") + (c.error ? `<div>錯誤</div><div style="color:var(--err)">${esc(c.error)}</div>` : "");
    $("backups").innerHTML = (s.backups || []).length ? s.backups.map(b =>
      `<tr><td>v${esc(b.version)}</td><td class="muted">${new Date(b.time*1000).toLocaleString()}</td>
       <td><button onclick="rollback('${esc(b.name)}','${esc(b.version)}')" ${busy ? "disabled" : ""}>回到這版</button></td></tr>`).join("")
      : '<tr><td colspan="3" class="muted">還沒有備份</td></tr>';
    if (s.job && !s.job.done && job !== s.job.id) follow(s.job.id);     // 別人正在執行的工作也顯示
  } catch (e) { if (e.message !== "401") $("banner").style.display = "block"; }
}
refresh();
setInterval(() => { if (!busy) refresh(); }, 3000);
</script>
</body>
</html>
