<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>實驗記錄</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e2e5e9; --soft:#eef0f3;
          --accent:#1971c2; --accent-soft:#e7f1fb; --ok:#2b8a3e; --warn:#e67700; --err:#e03131; --code:#f6f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --card:#151a21; --text:#e9ecef; --muted:#8b939d; --line:#2a313b; --soft:#1c222b;
            --accent:#4dabf7; --accent-soft:#16283a; --ok:#40c057; --warn:#ffa94d; --err:#ff6b6b; --code:#1b2129; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:14px/1.5 -apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:12px 14px 60px; }
  h1 { font-size:20px; margin:4px 0 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sp { flex:1; }
  h1 .btn { font-size:14px; font-weight:400; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .btn { border:1px solid var(--line); background:var(--soft); color:var(--text); border-radius:8px; padding:5px 11px; font:inherit; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .btn:hover { border-color:var(--accent); }
  .btn.pri { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.del { color:var(--err); background:transparent; }
  .btn.sm { padding:2px 8px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=search], input[type=date], select, textarea { font:inherit; padding:5px 9px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); min-width:0; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .bar input[type=search] { flex:1 1 220px; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px; }
  .tag { display:inline-block; padding:1px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12px; cursor:pointer; border:1px solid transparent; }
  .tag.on { border-color:var(--accent); font-weight:700; }
  .tag .n { color:var(--muted); margin-left:3px; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  .item:hover { border-color:var(--accent); }
  .item input[type=checkbox] { margin-top:4px; }
  .item .t { font-weight:700; font-size:15px; }
  .item .m { color:var(--muted); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; margin-top:2px; }
  .item .s { color:var(--muted); font-size:13px; margin-top:4px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .pill { display:inline-block; padding:0 7px; border-radius:999px; font-size:11px; font-weight:700; background:var(--soft); color:var(--muted); }
  .pill.auto { background:#e6fcf5; color:#087f5b; } .pill.bad { background:#fff5f5; color:var(--err); }
  @media (prefers-color-scheme: dark) { .pill.auto { background:#0b3328; color:#63e6be; } .pill.bad { background:#3a1a1a; } }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:24px; text-align:center; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
  .meta { color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:4px 14px; margin:2px 0 10px; }
  .meta a { color:var(--accent); }
  .warnbox { background:#fff4e6; color:#a24f00; border:1px solid #ffd8a8; border-radius:10px; padding:8px 12px; margin:8px 0; }
  @media (prefers-color-scheme: dark) { .warnbox { background:#33240f; color:#ffc078; border-color:#5c3c12; } }
  .errbox { background:#fff5f5; color:var(--err); border:1px solid #ffc9c9; border-radius:10px; padding:8px 12px; margin:8px 0; }
  @media (prefers-color-scheme: dark) { .errbox { background:#3a1a1a; border-color:#5c2626; } }
  /* 內文 */
  .md { overflow-wrap:anywhere; }
  .md h1, .md h2, .md h3, .md h4 { margin:16px 0 6px; line-height:1.3; } .md h1 { font-size:22px; } .md h2 { font-size:18px; } .md h3 { font-size:16px; } .md h4 { font-size:14px; }
  .md p { margin:6px 0; } .md ul, .md ol { margin:6px 0; padding-left:24px; }
  .md img { max-width:100%; height:auto; border-radius:6px; border:1px solid var(--line); display:block; margin:6px 0; }
  .md code { background:var(--code); padding:1px 5px; border-radius:4px; font:12.5px/1.4 ui-monospace,Consolas,Menlo,monospace; }
  .md pre { background:var(--code); padding:10px 12px; border-radius:8px; overflow-x:auto; } .md pre code { background:none; padding:0; }
  .md blockquote { margin:6px 0; padding:4px 12px; border-left:3px solid var(--accent); color:var(--muted); background:var(--soft); border-radius:0 8px 8px 0; }
  .md table { border-collapse:collapse; margin:8px 0; display:block; overflow-x:auto; max-width:100%; }
  .md th, .md td { border:1px solid var(--line); padding:4px 10px; text-align:left; } .md th { background:var(--soft); }
  .md hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
  .md a { color:var(--accent); }
  .md li.task { list-style:none; margin-left:-20px; }
  .sec { margin-top:16px; } .sec h3 { font-size:14px; margin:0 0 6px; color:var(--muted); }
  .files a, .links a { color:var(--accent); }
  .files li, .links li { margin:2px 0; }
  /* 留言 */
  .cm { border-top:1px solid var(--line); padding:8px 0; } .cm:first-child { border-top:0; }
  .cm .h { font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .cm .b { white-space:pre-wrap; margin-top:2px; }
  .cmform { display:flex; gap:8px; margin-top:8px; } .cmform textarea { flex:1; min-height:38px; resize:vertical; }
  /* 編輯 */
  .form { display:grid; grid-template-columns:90px 1fr; gap:8px 10px; align-items:center; }
  .form > label { color:var(--muted); font-size:13px; }
  .form input[type=text], .form select { width:100%; }
  .tools { display:flex; gap:4px; flex-wrap:wrap; margin:10px 0 6px; align-items:center; }
  .tools .btn { padding:3px 9px; }
  .edit2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .edit2.one { grid-template-columns:1fr; } .edit2.one .pv { display:none; }
  #body { width:100%; min-height:460px; resize:vertical; font:13px/1.55 ui-monospace,Consolas,Menlo,monospace; }
  .pv { border:1px solid var(--line); border-radius:8px; padding:8px 14px; min-height:460px; max-height:75vh; overflow:auto; background:var(--card); }
  .drop { outline:2px dashed var(--accent); outline-offset:-6px; }
  .lk { display:grid; grid-template-columns:110px 1fr 1fr auto; gap:6px; margin:4px 0; }
  .hist li { margin:3px 0; } .hist a { color:var(--accent); cursor:pointer; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#212529; color:#fff; padding:8px 16px; border-radius:10px; font-size:13px; z-index:99; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }
  .printhead { display:none; }
  @media (max-width: 760px) { .edit2 { grid-template-columns:1fr; } .pv { display:none; } .edit2.pvonly .pv { display:block; } .edit2.pvonly textarea { display:none; }
    .form { grid-template-columns:1fr; } .lk { grid-template-columns:1fr 1fr; } }
  @media print {
    :root { --bg:#fff; --card:#fff; --text:#000; --muted:#555; --line:#bbb; --soft:#f1f3f5; --code:#f4f4f4; }
    .qel-nav, .noprint, .bar, .tags, .cmform, .btn, .toast { display:none !important; }
    main { max-width:none; padding:0; }
    .card { border:0; padding:0; }
    .entry { page-break-after:always; } .entry:last-child { page-break-after:auto; }
    .md img { page-break-inside:avoid; max-height:90vh; object-fit:contain; }
    .md a { color:#000; text-decoration:none; }
    .printhead { display:block; font-size:11px; color:#555; border-bottom:1px solid #bbb; margin-bottom:8px; padding-bottom:4px; }
  }
</style>
</head>
<body>
<!--QEL-NAV-->
<main id="app"><div class="empty">讀取中…</div></main>
<div class="toast" id="toast"></div>
<input type="file" id="filepick" multiple hidden>
<script>
"use strict";
const $ = id => document.getElementById(id);
const app = $("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let ME = {}, PROJECTS = null, editTimer = null, dirty = false;

async function api(path, opt = {}) {
  const o = { credentials:"same-origin", cache:"no-store", ...opt };
  if (o.json !== undefined) { o.body = JSON.stringify(o.json); o.headers = { "Content-Type":"application/json" }; delete o.json; }
  const r = await fetch(path, o);
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent(location.pathname + location.hash); throw new Error("login"); }
  const d = await r.json().catch(() => ({}));
  if (r.status === 409 && d.conflict) { const e = new Error(d.error); e.conflict = d.entry; throw e; }
  if (!r.ok || d.ok === false) throw new Error(d.error || r.statusText);
  return d;
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2200); }
const fmt = t => { if (!t) return "—"; const d = new Date(t * 1000), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = t => { const s = Date.now() / 1000 - t; if (s < 60) return "剛剛"; if (s < 3600) return Math.floor(s / 60) + " 分鐘前";
  if (s < 86400) return Math.floor(s / 3600) + " 小時前"; return fmt(t).slice(0, 10); };
const STATUS = { finished:"完成", stopped:"中途停止", aborted:"中止", error:"錯誤", failed:"失敗" };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

// ---------------------------------------------------------------- Markdown（先跳脫，再轉；只允許 http(s)、站內網址）
function safeUrl(u) { u = String(u || "").trim(); return /^(https?:\/\/|\/|#)/i.test(u) && !/^\/\//.test(u) ? u : ""; }
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (m, alt, u) => {
    const url = safeUrl(u.replace(/&amp;/g, "&")); return url ? `<img src="${esc(url)}" alt="${alt}" loading="lazy">` : m; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
    const url = safeUrl(u.replace(/&amp;/g, "&")); if (!url) return m;
    const ext = /^https?:/i.test(url) ? ' target="_blank" rel="noopener"' : ""; return `<a href="${esc(url)}"${ext}>${t}</a>`; });
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, a, u) => `${a}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
       .replace(/~~([^~]+)~~/g, "<s>$1</s>").replace(/==([^=]+)==/g, "<mark>$1</mark>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${esc(codes[+i])}</code>`);
}
function md(src) {
  const L = String(src || "").replace(/\r\n?/g, "\n").split("\n"), out = [];
  let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]); i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    let m;
    if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(l)) { const buf = []; while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue; }
    if (/\|/.test(l) && i + 1 < L.length && isTableSep(L[i + 1])) {
      const head = cells(l); i += 2; const rows = [];
      while (i < L.length && /\|/.test(L[i]) && L[i].trim()) rows.push(cells(L[i++]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l), items = [];
      while (i < L.length && /^\s*([-*+]|\d+[.)])\s+/.test(L[i])) {
        let t = L[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        while (i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(L[i])) t += " " + L[i++].trim();
        const tm = /^\[([ xX])\]\s+(.*)$/.exec(t);
        items.push(tm ? `<li class="task">${tm[1] === " " ? "☐" : "☑"} ${inline(tm[2])}</li>` : `<li>${inline(t)}</li>`);
      }
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`); continue; }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < L.length && L[i].trim() && !/^(```|#{1,4}\s|\s*>|\s*([-*+]|\d+[.)])\s+)/.test(L[i]) && !(/\|/.test(L[i]) && i + 1 < L.length && isTableSep(L[i + 1]))) buf.push(L[i++]);
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("\n");
}

// ---------------------------------------------------------------- 路由：#/  #/e/<id>  #/e/<id>/edit  #/new  #/e/<id>/history  #/print/<id,id>
function route() {
  stopEditing();
  const h = location.hash || "#/";
  let m;
  if ((m = /^#\/e\/([\w-]+)\/edit$/.exec(h))) return showEdit(m[1]);
  if ((m = /^#\/e\/([\w-]+)\/history$/.exec(h))) return showHistory(m[1]);
  if ((m = /^#\/e\/([\w-]+)$/.exec(h))) return showEntry(m[1]);
  if (h === "#/new") return showEdit(null);
  if ((m = /^#\/print\/([\w,-]+)$/.exec(h))) return showPrint(m[1].split(","));
  return showList();
}
window.addEventListener("hashchange", () => {
  if (dirty && !confirm("編輯的內容還沒存，確定要離開？（草稿會留在這個瀏覽器）")) { history.back(); return; }
  dirty = false; route();
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// ---------------------------------------------------------------- 清單
const Q = { q:"", tag:"", project:"", kind:"", author:"", from:"", to:"" };
let selected = new Set();
async function showList() {
  document.title = "實驗記錄";
  app.innerHTML = `
  <h1>實驗記錄 <span class="sp"></span>
    <button class="btn" id="bprint" title="勾選幾筆後列印，或在列印視窗選「另存為 PDF」">🖨 列印 / PDF（<span id="nsel">0</span>）</button>
    <a class="btn pri" href="#/new">＋ 新增記錄</a></h1>
  <div class="bar">
    <input type="search" id="q" placeholder="搜尋標題、內文、留言、標籤…" value="${esc(Q.q)}">
    <select id="kind"><option value="">全部</option><option value="manual">手寫</option><option value="auto">量測自動</option></select>
    <select id="proj"><option value="">所有專案</option></select>
    <input type="text" id="author" placeholder="作者" size="8" value="${esc(Q.author)}">
    <input type="date" id="from" value="${esc(Q.from)}" title="從"> <input type="date" id="to" value="${esc(Q.to)}" title="到">
  </div>
  <div class="tags" id="tags"></div>
  <div class="list" id="list"><div class="empty">讀取中…</div></div>
  <div class="noprint" style="margin-top:10px;text-align:center"><button class="btn" id="more" hidden>載入更多</button></div>`;
  $("kind").value = Q.kind;
  let t;
  $("q").oninput = () => { clearTimeout(t); t = setTimeout(() => { Q.q = $("q").value; load(); }, 250); };
  $("author").oninput = () => { clearTimeout(t); t = setTimeout(() => { Q.author = $("author").value.trim(); load(); }, 300); };
  for (const k of ["kind", "from", "to"]) $(k).onchange = () => { Q[k] = $(k).value; load(); };
  $("proj").onchange = () => { Q.project = $("proj").value; load(); };
  $("bprint").onclick = () => { if (!selected.size) return toast("先勾選要列印的記錄"); location.hash = "#/print/" + [...selected].join(","); };
  projects().then(ps => { const s = $("proj"); if (!s) return;
    for (const p of ps) { const o = document.createElement("option"); o.value = p.id; o.textContent = (p.path || [p.name]).join(" › "); s.appendChild(o); }
    s.value = Q.project; }).catch(() => {});
  let offset = 0;
  async function load(more) {
    offset = more ? offset + 100 : 0;
    const qs = new URLSearchParams({ ...Q, offset, limit:100 });
    try {
      const d = await api("/api/notebook?" + qs);
      ME = d.me || {};
      const el = $("list"); if (!el) return;
      if (!more) el.innerHTML = "";
      if (!d.items.length && !more) el.innerHTML = `<div class="empty">${Object.values(Q).some(Boolean) ? "沒有符合的記錄" : "還沒有實驗記錄。按右上角「＋ 新增記錄」，或用 Lab Control 量測完會自動新增一筆。"}</div>`;
      for (const e of d.items) el.appendChild(itemEl(e));
      $("more").hidden = offset + d.items.length >= d.total;
      $("more").onclick = () => load(true);
      const tg = $("tags"); tg.innerHTML = "";
      for (const [name, n] of d.tags) { const s = document.createElement("span"); s.className = "tag" + (Q.tag === name ? " on" : "");
        s.innerHTML = `#${esc(name)}<span class="n">${n}</span>`; s.onclick = () => { Q.tag = Q.tag === name ? "" : name; load(); }; tg.appendChild(s); }
    } catch (e) { if (e.message !== "login") $("list").innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
  }
  load();
}
function itemEl(e) {
  const d = document.createElement("div"); d.className = "item";
  const st = e.status && e.status !== "finished" ? ` <span class="pill bad">${esc(STATUS[e.status] || e.status)}</span>` : "";
  d.innerHTML = `<input type="checkbox" ${selected.has(e.id) ? "checked" : ""} title="選取（列印 / PDF）">
    <div style="flex:1;min-width:0"><div class="t">${esc(e.title)} ${e.kind === "auto" ? '<span class="pill auto">量測</span>' : ""}${st}</div>
    <div class="m"><span>${esc(e.author_name || e.author || "")}</span><span>${fmt(e.created)}</span>
      ${e.project && e.project.name ? `<span>📁 ${esc(e.project.name)}</span>` : ""}
      ${(e.tags || []).map(t => `<span>#${esc(t)}</span>`).join("")}
      ${e.n_comments ? `<span>💬 ${e.n_comments}</span>` : ""}${e.n_files ? `<span>📎 ${e.n_files}</span>` : ""}
      ${e.rev > 1 ? `<span>改過 ${e.rev - 1} 次 · ${ago(e.updated)}</span>` : ""}</div>
    <div class="s">${esc(e.snippet)}</div></div>`;
  const cb = d.querySelector("input");
  cb.onclick = ev => { ev.stopPropagation(); cb.checked ? selected.add(e.id) : selected.delete(e.id); $("nsel").textContent = selected.size; };
  d.onclick = () => { location.hash = "#/e/" + e.id; };
  setTimeout(() => { const n = $("nsel"); if (n) n.textContent = selected.size; });
  return d;
}
async function projects() {
  if (PROJECTS) return PROJECTS;
  const d = await api("/api/platform/projects");
  const byId = {}; for (const p of d.projects || []) byId[String(p.id)] = p;
  PROJECTS = (d.projects || []).map(p => {
    const ids = []; let cur = p, guard = 0;
    while (cur && guard++ < 10) { ids.unshift(String(cur.id)); cur = byId[String(cur.parent_id ?? cur.parent ?? "")]; }
    return { id:String(p.id), name:p.name, path:p.path || [p.name], path_ids:ids, url:p.url || "" };
  }).sort((a, b) => a.path.join("/").localeCompare(b.path.join("/"), "zh-Hant"));
  return PROJECTS;
}

  app.innerHTML = `<div class="bar"><a class="btn" href="#/">← 清單</a><span class="muted">${ids.length} 筆 · 在列印視窗的「目的地」選「另存為 PDF」</span><span class="sp"></span>
    <label class="noprint small"><input type="checkbox" id="pc" checked> 含留言</label>
    <button class="btn pri" id="pp">🖨 列印 / PDF</button></div><div id="pages"><div class="empty">讀取中…</div></div>`;
  const entries = [];
  for (const id of ids) { try { entries.push((await api("/api/notebook/" + id)).entry); } catch (err) {} }
  entries.sort((a, b) => a.created - b.created);
  const render = () => { $("pages").innerHTML = entries.map(e => `<div class="card entry" style="margin-bottom:14px">${entryHtml(e, $("pc").checked)}</div>`).join("") || `<div class="empty">沒有可以列印的記錄</div>`; };
  render();
  $("pc").onchange = render;
  $("pp").onclick = () => window.print();
  document.title = entries.length === 1 ? entries[0].title : `實驗記錄（${entries.length} 筆）`;
  const imgs = [...app.querySelectorAll("img")];
  await Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  setTimeout(() => window.print(), 300);
}

route();
</script>
</body>
</html>
