<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="實驗室數據">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/icon-180.png">
<link rel="icon" href="/m/icon-192.png">
<title>實驗室數據</title>
<style>
  :root {
    --bg:#f3f4f6; --card:#ffffff; --text:#1c1f24; --muted:#6b7280; --line:#e2e5e9; --soft:#eef0f3;
    --accent:#1971c2; --ok:#2b8a3e; --warn:#e67700; --err:#e03131; --star:#f08c00;
    --grid:rgba(0,0,0,.08); --axis:#4b5563;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#111317; --card:#1b1d22; --text:#e9ecef; --muted:#9aa1ab; --line:#2b2f36; --soft:#23262c;
      --accent:#4dabf7; --ok:#51cf66; --warn:#ffa94d; --err:#ff6b6b; --star:#fcc419;
      --grid:rgba(255,255,255,.08); --axis:#aab1bb;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:15px/1.45 -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 14px 6px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:10px; }
  .top h1 { font-size:19px; margin:0; font-weight:700; letter-spacing:.5px; }
  .top .sp { flex:1; }
  .top a { color:var(--accent); text-decoration:none; font-size:14px; font-weight:600; }
  .find { display:flex; gap:8px; margin-top:8px; }
  .find input { flex:1; min-width:0; font:inherit; padding:8px 12px; border-radius:10px; border:1px solid var(--line);
                background:var(--card); color:var(--text); }
  .btn { font:inherit; font-size:14px; padding:7px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card);
         color:var(--text); cursor:pointer; white-space:nowrap; }
  .btn.on { border-color:var(--star); color:var(--star); font-weight:700; }
  .btn:disabled { opacity:.4; }
  .crumbs { display:flex; flex-wrap:wrap; gap:2px 4px; margin-top:8px; font-size:13px; color:var(--muted); }
  .crumbs a { color:var(--accent); text-decoration:none; cursor:pointer; }
  main { display:block; padding:8px 10px 28px; max-width:1500px; margin:0 auto; }
  @media (min-width:900px) { main { display:grid; grid-template-columns:minmax(320px, 400px) 1fr; gap:12px; align-items:start; }
                             #listPane { position:sticky; top:132px; max-height:calc(100vh - 140px); overflow:auto; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px 0; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid var(--line); cursor:pointer; }
  .row:first-child { border-top:0; }
  .row:active, .row.sel { background:var(--soft); }
  .row .ic { width:22px; text-align:center; flex:none; font-size:17px; }
  .row .main { flex:1; min-width:0; }
  .row .name { font-weight:600; overflow-wrap:anywhere; }
  .row .sub { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .row .r { font-size:12px; color:var(--muted); flex:none; text-align:right; font-variant-numeric:tabular-nums; }
  .star { color:var(--star); }
  .tag { display:inline-block; font-size:11px; background:var(--soft); border-radius:6px; padding:0 6px; margin:2px 4px 0 0; color:var(--text); }
  .section { font-size:12px; color:var(--muted); font-weight:600; padding:8px 14px 2px; }
  .empty { text-align:center; color:var(--muted); padding:30px 12px; }
  .empty b { display:block; color:var(--text); font-size:16px; margin-bottom:6px; }
  .banner { display:none; background:color-mix(in srgb, var(--warn) 16%, var(--card)); border:1px solid var(--warn);
            border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:14px; }
  #detail { display:none; }
  #detail .card { padding:12px 14px; }
  .dhead { display:flex; align-items:flex-start; gap:10px; }
  .dhead h2 { font-size:17px; margin:0; overflow-wrap:anywhere; flex:1; }
  .dsub { font-size:13px; color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums; }
  .nav { display:flex; gap:8px; margin-top:10px; }
  .nav .btn { flex:1; }
  canvas { display:block; width:100%; touch-action:pan-y; }
  #plot { height:68vw; min-height:240px; max-height:520px; }
  #cut { height:220px; }
  @media (min-width:900px) { #plot { height:460px; } #cut { height:260px; } }
  .cbar { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums; }
  .cbar i { flex:1; height:8px; border-radius:4px; }
  .probe { min-height:20px; font-size:13px; margin-top:6px; font-variant-numeric:tabular-nums; }
  .seg { display:flex; gap:6px; margin-bottom:6px; }
  .seg .btn { padding:4px 10px; font-size:13px; }
  .seg .btn.on { border-color:var(--accent); color:var(--accent); }
  .meta h3 { font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .meta table { width:100%; border-collapse:collapse; font-size:13px; }
  .meta td { padding:3px 0; border-top:1px solid var(--line); vertical-align:top; }
  .meta td:first-child { color:var(--muted); width:42%; padding-right:8px; }
  .back { display:none; }
  @media (max-width:899px) { body.show-detail #listPane { display:none; } body.show-detail #detail { display:block; } .back { display:inline-block; } }
  @media (min-width:900px) { #detail { display:block; } }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .warn { color:var(--warn); font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>實驗室數據</h1><span class="sp"></span><a href="/m">即時量測 ›</a></div>
  <div class="find">
    <input id="q" type="search" placeholder="搜尋檔名、路徑、標籤" enterkeyhint="search" autocomplete="off">
    <button class="btn" id="starBtn" title="只看加星號的">★</button>
  </div>
  <div class="crumbs" id="crumbs"></div>
</header>
<main>
  <div id="listPane">
    <div class="banner" id="banner"></div>
    <div id="list"></div>
  </div>
  <div id="detail">
    <div class="card">
      <div class="dhead"><button class="btn back" id="backBtn">‹ 列表</button><h2 id="dTitle"></h2></div>
      <div class="dsub" id="dSub"></div>
      <div id="dTags"></div>
      <div class="nav"><button class="btn" id="prevBtn">‹ 上一個</button><button class="btn" id="nextBtn">下一個 ›</button></div>
    </div>
    <div class="card" id="plotCard">
      <div id="plotMsg" class="empty" style="display:none"></div>
      <canvas id="plot"></canvas>
      <div class="cbar" id="cbar"><span id="cLo"></span><i id="cGrad"></i><span id="cHi"></span></div>
      <div class="probe" id="probe"></div>
      <div class="warn" id="acq"></div>
    </div>
    <div class="card" id="cutCard" style="display:none">
      <div class="seg"><button class="btn on" id="cutY">固定 <span id="cutYName"></span></button><button class="btn" id="cutX">固定 <span id="cutXName"></span></button></div>
      <canvas id="cut"></canvas>
      <div class="probe" id="cutProbe"></div>
      <div class="hint">在熱圖上點一下（或拖曳）選截面的位置。</div>
    </div>
    <div class="card meta" id="metaCard" style="display:none"><div id="meta"></div></div>
  </div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const META = { "meta.sweep":"掃描", "meta.single":"單張（沒有掃描）", "meta.frequency":"頻率", "meta.center_span":"中心 / 頻寬",
  "meta.points":"點數", "meta.ifbw":"IF 頻寬", "meta.averages":"平均", "meta.power":"功率", "meta.sources":"電源（固定）",
  "meta.data":"數據", "meta.traces":"曲線 × 次數 × 點數", "meta.created":"建立時間", "meta.on":"開", "meta.off":"關" };
let cur = { dir:"", files:[], folders:[], mode:"dir" }, file = null, pv = null, z = null, cutAt = null, cutKind = "y";
let star = false;
try { star = localStorage.getItem("qel-d-star") === "1"; } catch (e) {}

function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
function tr(t) { return typeof t === "string" ? t.replace(/meta\.[a-z_]+/g, k => META[k] || k) : t; }
function banner(t) { const b = $("banner"); b.textContent = t || ""; b.style.display = t ? "block" : "none"; }
function fmtNum(v, d = 4) {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(2);
  return (+v.toPrecision(d + 2)).toString();
}
const PFX = [[1e12,"T"],[1e9,"G"],[1e6,"M"],[1e3,"k"],[1,""],[1e-3,"m"],[1e-6,"µ"],[1e-9,"n"]];
function si(v, unit, d = 5) {
  if (v == null || !isFinite(v)) return "–";
  if (!unit || ["dB","dBm","deg","°","%"].includes(unit)) return fmtNum(v, d) + (unit ? " " + unit : "");
  const a = Math.abs(v); if (a === 0) return "0 " + unit;
  const [m, p] = PFX.find(([m]) => a >= m * 0.9999) || PFX[PFX.length - 1];
  return (+(v / m).toPrecision(d)).toString() + " " + p + unit;
}
function size(n) { return n == null ? "" : n >= 1 << 30 ? (n / 2 ** 30).toFixed(1) + " GB" : n >= 1 << 20 ? (n / 2 ** 20).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " kB"; }
function when(t) {
  if (!t) return "";
  const d = new Date(t * 1000), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function api(path) {
  const r = await fetch(path, { credentials:"same-origin", cache:"no-store" });
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent("/m/data" + location.hash); throw new Error("login"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.ok === false) throw new Error(d.error || r.statusText);
  return d;
}

// ---- 網址：#/d/<資料夾> · #/f/<檔> · #/s/<搜尋> ----------------------------------------------
function go(kind, value, replace) {
  const h = "#/" + kind + "/" + encodeURIComponent(value || "");
  if (location.hash === h) route(); else if (replace) { history.replaceState(null, "", h); route(); } else location.hash = h;
}
function parse() {
  const m = /^#\/([dfs])\/(.*)$/.exec(location.hash);
  return m ? [m[1], decodeURIComponent(m[2])] : ["d", (() => { try { return localStorage.getItem("qel-d-dir") || ""; } catch (e) { return ""; } })()];
}
async function route() {
  const [kind, value] = parse();
  if (kind === "f") {
    const dir = value.includes("/") ? value.slice(0, value.lastIndexOf("/")) : "";
    if (cur.mode !== "dir" || cur.dir !== dir || !cur.files.length) { if (cur.mode !== "search") await loadDir(dir); }
    document.body.classList.add("show-detail");
    openFile(value);
  } else {
    document.body.classList.remove("show-detail");
    if (kind === "s") await search(value); else await loadDir(value);
  }
}
window.addEventListener("hashchange", route);

// ---- 列表 ---------------------------------------------------------------------------------
function crumbs(dir, label) {
  const el = $("crumbs"); el.innerHTML = "";
  const add = (text, d) => { const a = document.createElement("a"); a.textContent = text; a.onclick = () => go("d", d); el.appendChild(a); };
  add("數據集散地", "");
  if (label) { el.insertAdjacentHTML("beforeend", ` › <span>${esc(label)}</span>`); return; }
  const parts = dir ? dir.split("/") : [];
  parts.forEach((p, i) => { el.insertAdjacentHTML("beforeend", " › "); add(p, parts.slice(0, i + 1).join("/")); });
}
async function loadDir(dir) {
  crumbs(dir);
  $("list").innerHTML = `<div class="empty">讀取中…</div>`;
  try {
    const d = await api("/api/data/list?dir=" + encodeURIComponent(dir));
    banner("");
    cur = { dir, files:d.files, folders:d.folders, mode:"dir", more:d.more };
    try { localStorage.setItem("qel-d-dir", dir); } catch (e) {}
    renderList();
  } catch (e) {
    if (e.message === "login") return;
    $("list").innerHTML = "";
    banner("讀不到數據索引：" + e.message + "（手機要在實驗室網路或開著 VPN；NAS 的數據索引要在執行）");
  }
}
async function search(q) {
  crumbs("", star && !q ? "★ 加星號的" : `搜尋「${q}」`);
  $("q").value = q;
  $("list").innerHTML = `<div class="empty">搜尋中…</div>`;
  try {
    const d = await api(`/api/data/search?q=${encodeURIComponent(q)}${star ? "&star=1" : ""}`);
    banner("");
    cur = { dir:"", files:d.files, folders:[], mode:"search", more:d.more };
    renderList();
  } catch (e) { if (e.message !== "login") { $("list").innerHTML = ""; banner(e.message); } }
}
function shown() { return cur.mode === "dir" && star ? cur.files.filter(f => f.star) : cur.files; }
function renderList() {
  const el = $("list"); el.innerHTML = "";
  const box = document.createElement("div"); box.className = "card";
  if (cur.folders.length) {
    box.insertAdjacentHTML("beforeend", `<div class="section">資料夾</div>`);
    for (const f of cur.folders) {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<span class="ic">📁</span><span class="main"><div class="name">${esc(f.name)}</div>` +
        `<div class="sub">${f.files ? f.files + " 個檔" : "空的"}${f.latest ? " · 最近 " + when(f.latest) : ""}</div></span><span class="r">›</span>`;
      r.onclick = () => go("d", cur.dir ? cur.dir + "/" + f.name : f.name);
      box.appendChild(r);
    }
  }
  const files = shown();
  if (files.length) {
    box.insertAdjacentHTML("beforeend", `<div class="section">${cur.mode === "search" ? "找到的檔" : "數據"}（${files.length}${cur.more ? "+" : ""}）</div>`);
    for (const f of files) {
      const r = document.createElement("div"); r.className = "row" + (file && file.rel === f.rel ? " sel" : ""); r.dataset.rel = f.rel;
      const tags = (f.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
      const where = cur.mode === "search" ? `<div class="sub">${esc(f.rel.slice(0, f.rel.lastIndexOf("/")))}</div>` : "";
      r.innerHTML = `<span class="ic">${f.status === "error" ? "⚠️" : f.dims === "2D" || /2/.test(f.dims) ? "▦" : "〜"}</span>` +
        `<span class="main"><div class="name">${f.star ? '<span class="star">★</span> ' : ""}${esc(f.name)}</div>${where}` +
        `<div class="sub">${when(f.created || f.mtime)} · ${esc(f.dims || "")} · ${size(f.size)}</div>${tags}</span>`;
      r.onclick = () => go("f", f.rel);
      box.appendChild(r);
    }
  }
  if (!cur.folders.length && !files.length) {
    box.innerHTML = `<div class="empty"><b>${cur.mode === "search" ? "沒有找到" : star ? "這裡沒有加星號的檔" : "這個資料夾是空的"}</b>` +
      `${cur.mode === "dir" ? "剛量好的檔幾分鐘內會進數據索引。" : ""}</div>`;
  }
  el.appendChild(box);
}
$("q").addEventListener("keydown", ev => { if (ev.key === "Enter") { const q = $("q").value.trim(); q || star ? go("s", q) : go("d", cur.dir); $("q").blur(); } });
$("q").addEventListener("search", () => { if (!$("q").value.trim() && cur.mode === "search") go("d", ""); });
function syncStar() { $("starBtn").classList.toggle("on", star); }
$("starBtn").onclick = () => {
  star = !star; syncStar();
  try { localStorage.setItem("qel-d-star", star ? "1" : "0"); } catch (e) {}
  if (cur.mode === "search") go("s", $("q").value.trim(), true); else renderList();
};
$("backBtn").onclick = () => history.length > 1 ? history.back() : go("d", cur.dir);

// ---- 一個檔 -------------------------------------------------------------------------------
async function openFile(rel) {
  for (const r of document.querySelectorAll(".row.sel")) r.classList.remove("sel");
  const row = [...document.querySelectorAll(".row")].find(r => r.dataset.rel === rel); if (row) row.classList.add("sel");
  const f = cur.files.find(x => x.rel === rel) || { rel, name:rel.split("/").pop() };
  file = f; pv = null; z = null; cutAt = null;
  $("dTitle").textContent = f.name;
  $("dSub").textContent = ""; $("dTags").innerHTML = ""; $("probe").textContent = ""; $("acq").textContent = "";
  $("metaCard").style.display = "none"; $("cutCard").style.display = "none";
  plotMsg("讀取中…");
  navButtons();
  try {
    const d = await api("/api/data/preview?path=" + encodeURIComponent(rel));
    if (file !== f) return;
    Object.assign(f, d.file); file = f;
    $("dSub").textContent = [when(f.created || f.mtime), f.dims, size(f.size), f.log_name && f.log_name !== f.name.replace(/\.[^.]+$/, "") ? f.log_name : ""].filter(Boolean).join(" · ");
    $("dTags").innerHTML = (f.star ? '<span class="tag star">★ 星號</span>' : "") + (f.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
    if (!d.preview) { plotMsg(d.reason || "這個檔沒有預覽"); return; }
    pv = d.preview;
    if (pv.kind === "2d") {
      const raw = Uint8Array.from(atob(pv.z), c => c.charCodeAt(0));
      z = new Float32Array(raw.buffer);
    }
    plotMsg("");
    renderMeta();
    const a = pv.acquisition;
    if (a && a.state && a.state !== "complete") $("acq").textContent = `量測沒有完成：${a.acquired_entries ?? "?"} / ${a.nominal_entries ?? "?"} 次${a.reason ? "（" + a.reason + "）" : ""}`;
    requestAnimationFrame(draw);
  } catch (e) {
    if (e.message !== "login" && file === f) plotMsg("讀不到預覽：" + e.message);
  }
}
function plotMsg(t) {
  $("plotMsg").textContent = t; $("plotMsg").style.display = t ? "" : "none";
  for (const id of ["plot", "cbar"]) $(id).style.display = t ? "none" : "";
}
function navButtons() {
  const list = shown(), i = list.findIndex(x => file && x.rel === file.rel);
  $("prevBtn").disabled = i <= 0; $("nextBtn").disabled = i < 0 || i >= list.length - 1;
  $("prevBtn").onclick = () => i > 0 && go("f", list[i - 1].rel, true);
  $("nextBtn").onclick = () => i >= 0 && i < list.length - 1 && go("f", list[i + 1].rel, true);
}
function renderMeta() {
  const secs = Array.isArray(pv.metadata) ? pv.metadata : [];
  if (!secs.length) return;
  let html = "";
  for (const s of secs) {
    if (!Array.isArray(s) || s.length < 2) continue;
    html += `<h3>${esc(tr(s[0]))}</h3><table>` + (s[1] || []).map(r => `<tr><td>${esc(tr(r[0]))}</td><td>${esc(tr(r[1]))}</td></tr>`).join("") + "</table>";
  }
  $("meta").innerHTML = html; $("metaCard").style.display = html ? "" : "none";
}

// ---- 畫圖 ---------------------------------------------------------------------------------
const MAPS = {
  bwr: [[33,102,172],[103,169,207],[209,229,240],[247,247,247],[253,219,199],[239,138,98],[178,24,43]],
  viridis: [[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[109,205,89],[180,222,44],[253,231,37]],
  magma: [[0,0,4],[28,16,68],[79,18,123],[129,37,129],[181,54,122],[229,80,100],[251,135,97],[254,194,135],[252,253,191]],
  gray: [[0,0,0],[255,255,255]],
};
function cmapName() {
  const n = String((pv && pv.colormap) || "").toLowerCase();
  return n.includes("viridis") ? "viridis" : n.includes("magma") || n.includes("inferno") ? "magma" : n.includes("gray") || n.includes("grey") ? "gray" : "bwr";
}
function cmap(t, name) {
  const M = MAPS[name]; t = Math.max(0, Math.min(1, t)) * (M.length - 1);
  const i = Math.min(M.length - 2, Math.floor(t)), f = t - i, a = M[i], b = M[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function setup(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight || 220;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }

function ticks(lo, hi, n) {

  for (let i = 0; i < xs.length; i++) {

    const x = MG.l + pw * (xv - xr[0]) / ((xr[1] - xr[0]) || 1), y = MG.t + ph * (1 - (yv - yr[0]) / ((yr[1] - yr[0]) || 1));

function pad(r) { const p = (r[1] - r[0]) * .05 || 1; return [r[0] - p, r[1] + p]; }
function draw() {
  if (!pv) return;
  if (pv.kind === "2d") { drawHeat(); drawCut(); } else drawLine();
}
function drawLine() {
  $("cbar").style.display = "none"; $("cutCard").style.display = "none";
  const cv = $("plot"), [g, w, h] = setup(cv), xs = pv.x, ys = pv.y;
  const xr = range(xs), yr = pad(range(ys));
  const [pw, ph] = axes(g, w, h, xr, yr, label(pv.x_name, pv.x_unit), label(pv.z_name, pv.z_unit), pv.x_unit, pv.z_unit);

function zRange() {
  if (pv.z_min != null && pv.z_max != null && isFinite(pv.z_min) && isFinite(pv.z_max) && pv.z_max > pv.z_min) return [pv.z_min, pv.z_max];
  const s = []; const stride = Math.max(1, Math.floor(z.length / 60000));

function drawHeat() {
  const cv = $("plot"), [g, w, h] = setup(cv), nx = pv.nx, ny = pv.ny, xs = pv.x, ys = pv.y, name = cmapName();
  const xr = [xs[0], xs[nx - 1]], yr = [ys[0], ys[ny - 1]];
  const xlo = Math.min(...xr), xhi = Math.max(...xr), ylo = Math.min(...yr), yhi = Math.max(...yr);
  const [pw, ph] = axes(g, w, h, [xlo, xhi], [ylo, yhi], label(pv.x_name, pv.x_unit), label(pv.y_name, pv.y_unit), pv.x_unit, pv.y_unit);

  const og = off.getContext("2d"), img = og.createImageData(nx, ny), px = img.data;
  const xflip = xs[nx - 1] < xs[0], yup = ys[ny - 1] >= ys[0];

  }

  g.imageSmoothingEnabled = nx < pw / 2 ? false : true;
  g.drawImage(off, MG.l, MG.t, pw, ph);
  $("cbar").style.display = ""; $("cLo").textContent = si(lo, pv.z_unit, 4); $("cHi").textContent = si(hi, pv.z_unit, 4);
  $("cGrad").style.background = "linear-gradient(90deg," + MAPS[name].map(c => `rgb(${c.join(",")})`).join(",") + ")";
  if (cutAt) {
    g.beginPath();
    if (cutKind === "y") { const x = MG.l + pw * (xs[cutAt.i] - xlo) / ((xhi - xlo) || 1); g.moveTo(x, MG.t); g.lineTo(x, MG.t + ph); }
    else { const y = MG.t + ph * (1 - (ys[cutAt.j] - ylo) / ((yhi - ylo) || 1)); g.moveTo(MG.l, y); g.lineTo(MG.l + pw, y); }
    g.strokeStyle = "rgba(255,255,255,.95)"; g.lineWidth = 4; g.stroke();          // 白邊＋黑虛線：任何色階都看得到

}
function nearest(arr, v) { let best = 0, d = Infinity; for (let i = 0; i < arr.length; i++) { const e = Math.abs(arr[i] - v); if (e < d) { d = e; best = i; } } return best; }
function drawCut() {

  $("cutY").classList.toggle("on", cutKind === "y"); $("cutX").classList.toggle("on", cutKind === "x");

$("plot").addEventListener("pointerdown", ev => { dragging = true; pick(ev); });
