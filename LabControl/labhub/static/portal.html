<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>量子工程平台</title>
<style>
  :root {
    --bg:#f4f5f7; --card:#fff; --soft:#f0f2f5; --text:#1f2328; --muted:#6b7280; --border:#e1e4e8;
    --accent:#1971c2; --accent-soft:#e7f1fb; --ok:#2b8a3e; --warn:#e67700; --err:#e03131;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#111317; --card:#1b1e24; --soft:#23272e; --text:#e9ecef; --muted:#9097a0; --border:#2f333a;
      --accent:#4dabf7; --accent-soft:#1d2d3d; --ok:#51cf66; --warn:#ffa94d; --err:#ff6b6b;
    }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 "Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--border);
           padding:10px 16px; padding-top:max(10px, env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px; }
  header .brand img { width:26px; height:26px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav a { padding:6px 12px; border-radius:8px; color:var(--muted); font-weight:600; }
  nav a.on { background:var(--accent-soft); color:var(--accent); }
  header .sp { flex:1; }
  header .who { color:var(--muted); font-size:13px; display:flex; gap:8px; align-items:center; }
  .badge { font-size:11px; padding:1px 7px; border-radius:6px; background:var(--accent); color:#fff; font-weight:700; }
  main { max-width:1200px; margin:0 auto; padding:16px; padding-bottom:max(40px, env(safe-area-inset-bottom)); }
  h2 { font-size:16px; margin:18px 0 10px; display:flex; align-items:center; gap:8px; }
  h2 .n { color:var(--muted); font-weight:400; font-size:13px; }
  .muted { color:var(--muted); }
  .small { font-size:12px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; }
  .tile { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:6px; min-height:140px; }
  .tile.off { opacity:.5; }
  .appbar { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:10px 12px; margin:4px 0 14px; }
  .appbar img { width:42px; height:42px; border-radius:10px; flex:none; }
  .appbar > div { flex:1; min-width:0; } .appbar span { color:var(--muted); font-size:13px; }
  .appbar .x { border:0; background:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px 6px; }
  .tile .t { font-size:16px; font-weight:700; }
  .tile .d { color:var(--muted); font-size:13px; flex:1; }
  .tile .k { font-size:11px; color:var(--muted); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:7px 12px; border-radius:8px;
         border:1px solid var(--border); background:var(--soft); color:var(--text); font:inherit; font-weight:600; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.small { padding:3px 9px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:8px; padding:7px 10px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .bar input[type=search] { flex:1; min-width:180px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600;
          border:1px solid var(--border); background:var(--soft); color:var(--text); cursor:pointer; user-select:none; white-space:nowrap; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip .c { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .chip .x { opacity:.7; margin-left:2px; }
  .chip small { font-weight:400; opacity:.8; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:14px; align-items:start; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } }
  .list { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .item { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; display:grid; gap:4px; }
  .item:last-child { border-bottom:0; }
  .item:hover, .item.sel { background:var(--soft); }
  .item .nm { font-weight:600; overflow-wrap:anywhere; }
  .item .mt { color:var(--muted); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; position:sticky; top:72px; }
  .panel h3 { margin:0 0 6px; font-size:15px; overflow-wrap:anywhere; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px; margin:8px 0; }
  .kv b { color:var(--muted); font-weight:400; }
  .paper { padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px; }
  .paper:last-child { border-bottom:0; }
  .paper .a { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; font-size:13px; vertical-align:middle; }
  th { color:var(--muted); font-weight:600; background:var(--soft); }
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .sw { position:relative; display:inline-block; width:36px; height:20px; }
  .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; background:var(--border); border-radius:20px; transition:.15s; cursor:pointer; }
  .sw span::before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .sw input:checked + span { background:var(--ok); }
  .sw input:checked + span::before { transform:translateX(16px); }
  .sw input:disabled + span { opacity:.45; cursor:default; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .stat .v { font-size:20px; font-weight:700; }
  .stat .k { color:var(--muted); font-size:12px; }
  .ok { color:var(--ok); } .err { color:var(--err); } .warn { color:var(--warn); }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg);
           padding:8px 16px; border-radius:10px; font-weight:600; opacity:0; transition:.2s; pointer-events:none; z-index:20; max-width:90vw; }
  .toast.show { opacity:.95; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  .drop { border:2px dashed var(--border); border-radius:12px; padding:22px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.on { border-color:var(--accent); color:var(--accent); }
  .upl { margin-top:10px; display:none; }
  .upl.show { display:block; }
  .upl .row { display:flex; justify-content:space-between; gap:12px; font-size:13px; margin-bottom:4px; }
  .upl .bar2 { height:10px; border-radius:6px; background:var(--border); overflow:hidden; }
  .upl .bar2 > i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
  .upl .bar2.wait > i { width:100% !important; opacity:.45; animation:uplpulse 1.2s ease-in-out infinite; }
  @keyframes uplpulse { 50% { opacity:.15; } }
  .pub td { vertical-align:middle; }
  .pub .st { min-width:180px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:6px; }
  .dot.on { background:var(--ok); }
  .cat { margin-bottom:14px; }
  .cat h4 { margin:0 0 6px; font-size:13px; color:var(--muted); }
  .drag-hint { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<!--QEL-NAV-->
<main id="main"><div class="empty">載入中…</div></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const size = n => n == null ? "" : n < 1024 ? n + " B" : n < 1048576 ? (n/1024).toFixed(1) + " KB" : n < 1073741824 ? (n/1048576).toFixed(1) + " MB" : (n/1073741824).toFixed(2) + " GB";
const when = t => t ? new Date(t * 1000).toLocaleString("zh-TW", {hour12:false}) : "";
let ME = null, TAGS = [], TAGMAP = {}, PROJECTS = [], PROJ_ERR = "";

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }

async function api(path, opts) {
  opts = Object.assign({credentials:"same-origin", headers:{}}, opts || {});
  if (opts.json !== undefined) { opts.body = JSON.stringify(opts.json); opts.headers["Content-Type"] = "application/json"; delete opts.json; }
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent("/portal" + location.hash); throw new Error("未登入"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function tagChip(name, opts) {
  opts = opts || {};
  const t = TAGMAP[name] || {};
  const col = t.color ? `<span class="c" style="background:${esc(t.color)}"></span>` : "";
  const cnt = opts.count ? ` <small>${t.papers ? "📄" + t.papers : ""}${t.data ? " 📊" + t.data : ""}</small>` : "";
  return `<span class="chip${opts.on ? " on" : ""}" data-tag="${esc(name)}" title="${esc(t.description || name)}">${col}${esc(name)}${cnt}${opts.x ? '<span class="x" data-x="1">✕</span>' : ""}</span>`;
}

async function loadProjects(force) {
  try { const r = await api("/api/platform/projects" + (force ? "?refresh=1" : "")); PROJECTS = r.projects || []; PROJ_ERR = ""; }
  catch (e) { PROJECTS = []; PROJ_ERR = e.message; }
}
const projOptions = (sel, none) => `<option value="">${esc(none)}</option>` + PROJECTS.map(p => `<option value="${esc(p.id)}" ${String(sel) === String(p.id) ? "selected" : ""}>${esc(p.name)}</option>`).join("");
async function openProject(p) {
  try { await api("/api/platform/bus/labcontrol", {method:"POST", json:{type:"open_project", project:p.id, name:p.name, from_module:"portal"}});
    toast(`已送出：你電腦上開著的量測程式（Lab Control）會用讀檔程式開啟「${p.name}」的所有數據`); } catch (e) { toast(e.message); }
}

async function loadTags() {
  const r = await api("/api/platform/tags");
  TAGS = r.tags || []; TAGMAP = {};
  for (const t of TAGS) TAGMAP[t.name] = t;
}

// ---- 模塊 --------------------------------------------------------------------
const MY_OS = /Windows/i.test(navigator.userAgent) ? "windows" : /Mac/i.test(navigator.userAgent) && !/iPhone|iPad/i.test(navigator.userAgent) ? "macos" : "";
const ARCH = {universal2: "Apple 晶片與 Intel", arm64: "Apple 晶片", x86_64: "Intel"};
function dlLabel(f) {
  if (f.platform === "windows") return "Windows 版";
  return `Mac 版${f.arch ? "（" + ARCH[f.arch] + "）" : ""}`;
}
function downloadButtons(m) {
  const dl = (m.downloads || []).slice().sort((a, b) => (b.platform === MY_OS) - (a.platform === MY_OS));
  const src = m.versions && m.versions.find(v => v.version === m.latest);
  const zip = src && src.files.find(f => f.name.toLowerCase().endsWith(".zip") && !f.platform);
  let h = `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">` +
    dl.map(f => `<a class="btn ${f.platform === MY_OS ? "primary" : "small"}" href="${esc(f.url)}" download title="${esc(f.name)}・${size(f.size)}">⬇ ${esc(dlLabel(f))}　${esc(f.version)}</a><span class="small muted" style="margin:-2px 0 2px 4px">${esc(f.name.split(".").pop())} · ${size(f.size)}</span>`).join("") + `</div>`;
  if (!dl.length) h = `<span class="small muted">站長還沒有上傳 Windows / Mac 版</span>`;
  if (zip) h += `<div style="margin-top:4px"><a class="small" href="${esc(zip.url)}" title="給 Lab APP 或有 Python 的電腦">Python 版 zip ${esc(m.latest)}</a></div>`;
  if (dl.length) h += `<div class="small muted" style="margin-top:6px">第一次開啟：Windows 出現「Windows 已保護您的電腦」→ 其他資訊 → 仍要執行；
    macOS 打開 .dmg 把 App 拖到「應用程式」，第一次用右鍵 →「打開」。</div>`;
  return h;
}

function viewHome() {
  const mods = ME.modules || [];
  const tile = m => {
    const off = !m.allowed;
    let act = "";
    if (off) act = `<span class="small muted">站長沒有開放</span>`;
    else if (m.kind === "web" && m.url) act = `<a class="btn primary" href="${esc(m.url)}" ${m.url.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>開啟</a>`;
    else if (m.kind === "app") {
      act = downloadButtons(m) + `<div class="small muted" style="margin-top:4px">裝好之後程式會自己更新。也可以把 <a href="/get">下載頁</a> 給新同學。</div>`;
    }
    return `<div class="tile${off ? " off" : ""}"><div class="t">${esc(m.name)}</div><div class="k">${esc(m.id)} · ${m.kind === "web" ? "網頁" : "桌面程式"}${m.owner_only ? " · 站長" : ""}</div>
      <div class="d">${esc(m.description || "")}</div><div>${act}</div></div>`;
  };
  const shown = mods.filter(m => !m.hidden && !["catalog", "nodes"].includes(m.id));   // 1.0.7：換成「數據查看」「量測設置」
  let hideBanner = false;
  try { hideBanner = localStorage.getItem("qel.installBanner") === "off"; } catch (e) { /* 無痕視窗 */ }
  const banner = (window.qelApp && (window.qelApp.standalone || window.qelApp.installed)) || hideBanner ? "" :
    `<div class="appbar" id="appbar"><img src="/app-icon-192.png" alt=""><div><b>把平台裝成 App</b><br><span>跟論文庫一樣，從桌面或主畫面直接開。</span></div>
     <a class="btn primary" href="/install" id="appbar-go">安裝</a><button class="x" id="appbar-x" title="不再顯示">✕</button></div>`;
  $("#main").innerHTML = banner + `<h2>模塊下載 <span class="n">${shown.filter(m => m.allowed).length} 個可用</span></h2>
    <div class="tiles">${shown.map(tile).join("")}</div>
    <h2>網頁</h2><div class="tiles">
      <div class="tile"><div class="t">數據查看</div><div class="d">瀏覽數據集散地、看預覽與量測參數；電腦上可以直接用讀檔程式開啟。</div><div><a class="btn primary" href="/data">開啟</a></div></div>
      <div class="tile"><div class="t">量測查看</div><div class="d">每台量測電腦正在量什麼：進度、熱圖、最後一條 trace。</div><div><a class="btn primary" href="/live">開啟</a></div></div>
      <div class="tile"><div class="t">量測設置</div><div class="d">量測電腦與儀器狀態、用範本編輯方案並送到量測電腦、量測電腦對應與設定檔。</div><div><a class="btn primary" href="/setup">開啟</a></div></div>
      ${window.qelApp && window.qelApp.standalone ? "" : `<div class="tile"><div class="t">⬇ 安裝 App</div><div class="d">跟論文庫一樣，把這個網站裝成 App：電腦（Chrome / Edge / Safari）、Android、iPhone / iPad 都可以，裝好後從桌面或主畫面直接開。</div><div><a class="btn primary" href="/install">安裝步驟</a></div></div>`}
    </div>`;
  const x = document.getElementById("appbar-x");
  if (x) x.onclick = () => { try { localStorage.setItem("qel.installBanner", "off"); } catch (e) { /* 無痕視窗 */ } $("#appbar").remove(); };
  const go = document.getElementById("appbar-go");
  if (go) go.onclick = ev => { if (window.qelApp && window.qelApp.prompt) { ev.preventDefault(); window.qelApp.install(); } };
}

// ---- 數據目錄 -----------------------------------------------------------------
const DS = {tags:[], mode:"and", q:"", sel:null, project:""};
function itemRow(x) {
  return `<div class="item${DS.sel === x.id ? " sel" : ""}" data-id="${x.id}" draggable="true">
    <div class="nm">${esc(x.name)}${x.exists ? "" : ' <span class="small warn">（只在量測電腦上）</span>'}</div>
    <div class="mt">${x.project_name ? `<span>📁 ${esc(x.project_name)}</span>` : ""}<span>🖥 ${esc(x.node)}</span>${x.user ? `<span>👤 ${esc(x.user)}</span>` : ""}<span>${when(x.created)}</span><span>${size(x.size)}</span></div>
    ${x.tags.length ? `<div class="chips">${x.tags.map(t => tagChip(t)).join("")}</div>` : ""}</div>`;
}

async function viewData(params) {
  if (params.get("tag")) DS.tags = [params.get("tag")];
  if (params.get("id")) DS.sel = params.get("id");
  if (params.has("project")) DS.project = params.get("project");
  $("#main").innerHTML = `
    <div class="bar"><select id="proj">${projOptions(DS.project, "全部專案")}</select><input type="search" id="q" placeholder="搜尋檔名、量測方案、說明…" value="${esc(DS.q)}">
      <select id="mode"><option value="and">符合全部標籤</option><option value="or">符合任一標籤</option></select></div>
    <div class="chips" id="tagf" style="margin-bottom:12px"></div>
    <div class="layout"><div><div class="small muted" id="cnt" style="margin-bottom:6px"></div><div class="list" id="items"></div></div>
      <div class="panel" id="detail"><div class="muted">選一筆數據看詳細資料、相關論文。<br><span class="drag-hint">桌面版：可以把數據直接拖到量測模塊（套用設定）或讀檔模塊（開檔）。</span></div></div></div>`;
  $("#mode").value = DS.mode;
  const renderTagFilter = () => {
    const used = TAGS.filter(t => t.data > 0 || DS.tags.includes(t.name));
    $("#tagf").innerHTML = used.length ? used.map(t => tagChip(t.name, {on: DS.tags.includes(t.name), count: true})).join("") : `<span class="small muted">還沒有加標籤的數據</span>`;
  };
  renderTagFilter();
  $("#tagf").onclick = e => { const c = e.target.closest(".chip"); if (!c) return; const n = c.dataset.tag;
    DS.tags = DS.tags.includes(n) ? DS.tags.filter(x => x !== n) : DS.tags.concat([n]); renderTagFilter(); load(); };
  $("#mode").onchange = e => { DS.mode = e.target.value; load(); };
  $("#proj").onchange = e => { DS.project = e.target.value; load(); };
  let tq; $("#q").oninput = e => { clearTimeout(tq); tq = setTimeout(() => { DS.q = e.target.value.trim(); load(); }, 250); };
  $("#items").onclick = e => { const it = e.target.closest(".item"); if (it) { DS.sel = it.dataset.id; document.querySelectorAll(".item.sel").forEach(x => x.classList.remove("sel")); it.classList.add("sel"); showItem(it.dataset.id); } };
  $("#items").ondragstart = e => { const it = e.target.closest(".item"); if (!it) return;
    const url = location.origin + "/api/platform/catalog/" + it.dataset.id;
    e.dataTransfer.setData("text/uri-list", url); e.dataTransfer.setData("text/plain", url);
    e.dataTransfer.setData("application/x-qel-catalog", JSON.stringify({id: it.dataset.id, hub: location.origin})); };
  async function load() {
    const qs = new URLSearchParams({tags: DS.tags.join(","), mode: DS.mode, q: DS.q, limit: 300, project: DS.project});
    try {
      const r = await api("/api/platform/catalog?" + qs);
      $("#cnt").textContent = `${r.total} 筆`;
      $("#items").innerHTML = r.items.length ? r.items.map(itemRow).join("") : `<div class="empty">沒有符合的數據</div>`;
    } catch (e) { $("#items").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
  }
  await load();
  if (DS.sel) showItem(DS.sel);
}

async function showItem(id) {
  const d = $("#detail");
  d.innerHTML = `<div class="muted">載入中…</div>`;
  let x;
  try { x = await api("/api/platform/catalog/" + id); } catch (e) { d.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const meta = Object.entries(x.meta || {}).slice(0, 12).map(([k, v]) => `<b>${esc(k)}</b><span>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</span>`).join("");
  d.innerHTML = `<h3>${esc(x.name)}</h3>
    <div class="kv"><b>節點</b><span>${esc(x.node)}</span><b>路徑</b><span>${esc(x.rel)}</span><b>量測者</b><span>${esc(x.user || "—")}</span>

async function renderPapers(el, tags, cntEl) {
  if (!tags.length) { el.innerHTML = "這筆數據還沒有標籤。加上標籤就會連到論文庫裡同標籤的論文。"; return; }
  try {
    const r = await api("/api/platform/papers?tags=" + encodeURIComponent(tags.join(",")));
    if (cntEl) cntEl.textContent = r.papers.length ? r.papers.length + " 篇" : "";
    const errs = r.tags.filter(t => t.error).map(t => t.error);
    el.innerHTML = (r.papers.length ? r.papers.map(p => `<div class="paper"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="a">${esc((p.authors || []).slice(0, 4).join(", "))}${(p.authors || []).length > 4 ? " 等" : ""}${p.year ? " · " + esc(p.year) : ""}${p.venue ? " · " + esc(p.venue) : ""}</div>
      <div class="chips">${p.tags.map(t => tagChip(t)).join("")}</div></div>`).join("") : `<div>論文庫裡還沒有這些標籤的論文。</div>`) +
      (errs.length ? `<div class="warn small">${esc(errs[0])}</div>` : "") +
      `<div class="small" style="margin-top:6px">${r.tags.filter(t => t.url).map(t => `<a href="${esc(t.url)}" target="_blank" rel="noopener">在論文庫看「${esc(t.name)}」→</a>`).join("　")}</div>`;
  } catch (e) { el.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

// ---- 1.0.13：從 GitHub 取得新版（Hub 自己下載雲端打包好的檔案）------------------------------------------
const GH = {timer: null, data: null};
async function loadGithub(refresh) {
  const el = $("#gh"); if (!el) return;
  try { GH.data = await api("/api/platform/console/github" + (refresh ? "?refresh=1" : "")); }
  catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  renderGithub();
  const j = GH.data.job;
  clearTimeout(GH.timer);
  if (j && !j.done) GH.timer = setTimeout(() => loadGithub(), 1500);
  else if (j && j.done && GH.wasRunning) { GH.wasRunning = false; loadItems(); loadStatus();
    if (GH.publishAfter) { GH.publishAfter = false; publishAll(); } }
}
function renderGithub() {
  const el = $("#gh"), d = GH.data; if (!el || !d) return;
  const j = d.job, running = j && !j.done;
  const rows = (d.releases || []).map(r => `<div style="margin:6px 0"><b>${esc(r.name)}</b>
      <span class="small muted">${r.date ? when(Date.parse(r.date) / 1000) : ""} · <a href="${esc(r.url)}" target="_blank" rel="noopener">GitHub</a></span>
      <div class="small">${r.files.map(f => `<span style="display:inline-block;margin:2px 10px 2px 0">${f.online ? "✔" : f.staged ? "⏳" : f.older ? "↩" : "●"}
        ${esc(f.name)} <span class="muted">${size(f.size)}${f.online ? "（線上已有）" : f.staged ? "（已在下面待發佈）" : f.older ? "（比線上舊，略過）" : ""}</span></span>`).join("")}</div></div>`).join("");
  const prog = j ? `<div class="small" style="margin-top:6px">${j.files.map(f => `<div>${esc(f.name)}：${esc(f.status)}${f.size && f.status === "下載中" ? ` ${(100 * f.got / f.size).toFixed(0)}%` : ""}</div>`).join("")}
      ${j.done ? `<div class="muted">${esc(j.message || "")}</div>` : ""}</div>` : "";
  const n = (d.wanted || []).length;
  el.innerHTML = `${d.error ? `<div class="err">${esc(d.error)}</div>` : rows || '<div class="small muted">GitHub 上還沒有發佈</div>'}
    <div class="bar" style="margin-top:8px">
      <button class="btn primary" id="ghgo"${running || !n ? " disabled" : ""}>⬇ 下載 ${n} 個新檔案並發佈</button>
      <button class="btn small" id="ghonly"${running || !n ? " disabled" : ""}>只下載（之後再發佈）</button>
      <button class="btn small" id="ghcheck"${running ? " disabled" : ""}>重新檢查</button>
      <label class="small"><input type="checkbox" id="ghauto"${d.auto ? " checked" : ""}> 自動：每 30 分鐘檢查，有新版就下載並發佈</label>
      ${d.last_auto ? `<span class="small muted">上次自動檢查 ${when(d.last_auto)}：${esc(d.last_auto_result || "")}</span>` : ""}</div>${prog}`;
  const go = async publish => {
    try { GH.wasRunning = true; GH.publishAfter = publish;
      await api("/api/platform/console/github/fetch", {method: "POST", json: {publish: false}}); loadGithub(); }
    catch (e) { toast(e.message); }
  };
  $("#ghgo").onclick = () => go(true);
  $("#ghonly").onclick = () => go(false);
  $("#ghcheck").onclick = () => loadGithub(true);
  $("#ghauto").onchange = async e => {
    try { await api("/api/platform/console/github/auto", {method: "PUT", json: {auto: e.target.checked}});
      toast(e.target.checked ? "已開啟自動更新：有新版會自動下載並發佈到各電腦" : "已關閉自動更新"); }
    catch (err) { e.target.checked = !e.target.checked; toast(err.message); }
  };
}
function conLog(m) { const el = $("#publog"); if (el) el.textContent = m; }
// 上傳到 Hub：XMLHttpRequest 才拿得到上傳進度（fetch 沒有）。進度條、速度、剩餘時間；上傳完 Hub 還要檢查檔案。
const UPL = {xhr: null, cancelled: false};
function sendFile(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    UPL.xhr = xhr;
    xhr.open("POST", url);
    xhr.withCredentials = true;
    xhr.upload.onprogress = e => onProgress(e.loaded, e.lengthComputable ? e.total : file.size);
    xhr.upload.onload = () => onProgress(file.size, file.size, true);
    xhr.onload = () => {
      UPL.xhr = null;
      if (xhr.status === 401) { location.href = "/login?next=" + encodeURIComponent("/portal" + location.hash); return reject(new Error("未登入")); }
      let j = {}; try { j = JSON.parse(xhr.responseText || "{}"); } catch (e) {}
      if (xhr.status < 200 || xhr.status >= 300 || j.ok === false) return reject(new Error(j.error || ("HTTP " + xhr.status)));
      resolve(j);
    };
    xhr.onerror = () => { UPL.xhr = null; reject(new Error("連線中斷")); };
    xhr.onabort = () => { UPL.xhr = null; reject(new Error("已取消")); };
    xhr.send(file);
  });
}
const dur = s => !isFinite(s) || s < 0 ? "" : s < 60 ? Math.ceil(s) + " 秒" : Math.floor(s / 60) + " 分 " + Math.ceil(s % 60) + " 秒";
function uplShow(name, done, total, t0, k, n, waiting) {
  $("#upl").classList.add("show");
  $("#uplname").textContent = name;
  const pct = total ? Math.min(100, done * 100 / total) : 0;
  const sec = (performance.now() - t0) / 1000, rate = sec > 0.2 ? done / sec : 0;
  $("#uplbar").classList.toggle("wait", !!waiting);
  $("#uplbar > i").style.width = pct.toFixed(1) + "%";
  $("#uplinfo").textContent = waiting ? "上傳完成，Hub 檢查檔案中…"
    : `${pct.toFixed(0)}% · ${size(done)} / ${size(total)}` + (rate ? ` · ${size(rate)}/s · 剩下 ${dur((total - done) / rate)}` : "");
  $("#uplall").textContent = n > 1 ? `第 ${k} / ${n} 個檔案` : "";
}
async function upload(files) {
  if (!files.length) return;
  UPL.cancelled = false;
  $("#uplcancel").onclick = () => { UPL.cancelled = true; if (UPL.xhr) UPL.xhr.abort(); };
  $("#drop").style.pointerEvents = "none";
  try {
    for (const [i, f] of files.entries()) {
      if (UPL.cancelled) break;
      conLog(`上傳 ${f.name}…`);
      let ver = "";
      for (;;) {
        const t0 = performance.now();
        uplShow(f.name, 0, f.size, t0, i + 1, files.length);
        try {
          await sendFile("/api/platform/console/stage?filename=" + encodeURIComponent(f.name) + "&size=" + f.size + (ver ? "&version=" + encodeURIComponent(ver) : ""),
                         f, (done, total, finished) => uplShow(f.name, done, total, t0, i + 1, files.length, finished));
          toast(`${f.name}：上傳完成`);
        } catch (e) {
          if (String(e.message).startsWith("需要版本號")) {           // 安裝檔檔名沒有版本（例如 LabLogViewer-Windows-setup.exe）
            ver = (prompt(`${e.message}\n\n版本號：`, "") || "").trim();
            if (ver) continue;
          }
          toast(`${f.name}：${e.message}`);
        }
        break;
      }
      loadItems();
    }
  } finally {
    $("#upl").classList.remove("show");
    $("#drop").style.pointerEvents = "";
    $("#pick").value = "";
    conLog(""); loadItems();
  }
}
async function loadItems() {
  try { CON.items = (await api("/api/platform/console/items")).items; } catch (e) { $("#pubs").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  renderItems();
  // 1.0.11：重新整理頁面後，還在跑的更新工作繼續顯示進度，直到結束
  const run = CON.items.filter(x => x.running && !x.done && !x.failed);
  if (run.length && !CON.busy) {
    CON.busy = true; renderItems();
    for (const x of run) { await followJob(x); renderItems(); }
    CON.busy = false;
    await loadItems(); loadStatus();
  }
}
function renderItems() {
  const el = $("#pubs"); if (!el) return;
  if (!CON.items.length) { el.innerHTML = `<div class="small muted">還沒有上傳的檔案。</div>`; $("#goall").disabled = true; return; }
  el.innerHTML = `<table class="pub"><tr><th>檔案</th><th>判斷為</th><th>新版本</th><th>線上</th><th class="st">狀態</th><th></th></tr>${CON.items.map(x => {
    const st = x.done || x.status !== "待發佈" ? x.status : x.online ? "線上已是這一版（會略過）" : x.older ? "⚠ 比線上舊（會退回舊版）" : "待發佈";
    return `<tr><td>${esc(x.file)}<div class="small muted">${size(x.size)}${x.sha256 ? ` · sha256 <code title="${esc(x.sha256)}">${esc(x.sha256.slice(0, 16))}…</code>` : ""}</div></td><td>${esc(x.name)}</td><td>${esc(x.version)}</td>
      <td>${esc(x.current || "—")}</td><td class="st ${x.failed ? "err" : x.done ? "ok" : x.older ? "warn" : ""}">${esc(st)}</td>
      <td>${CON.busy ? "" : `<button class="btn small" data-del="${x.id}">移除</button>`}</td></tr>`; }).join("")}</table>`;
  $("#goall").disabled = CON.busy || !CON.items.some(x => !x.done && !x.online);
}
async function publishAll() {
  const todo = CON.items.filter(x => !x.done && !x.online);
  if (!todo.length || CON.busy) return;
  if (todo.some(x => x.older) && !confirm("有比線上舊的版本，確定要退回舊版？")) return;
  CON.busy = true; renderItems();
  for (const x of todo) {
    x.status = "發佈中…"; renderItems(); conLog(`${x.name} ${x.version}`);
    try {
      const r = await api("/api/platform/console/publish/" + x.id, {method: "POST"});
      Object.assign(x, r);
      if (r.job) await followJob(x);
    } catch (e) { x.status = "❌ " + e.message; x.failed = true; }
    renderItems();
  }
  CON.busy = false; conLog("全部完成"); toast("全部完成");
  await loadItems(); loadStatus();
}
async function followJob(x) {
  let after = 0, misses = 0;
  for (;;) {
    try {
      const v = await api(`/api/platform/console/jobs/${x.id}?after=${after}&wait=10`);
      misses = 0; after = v.n_lines || after;
      const cur = (v.steps || []).find(s => s.status === "running");
      x.status = cur ? `${cur.title}… ${cur.msg || ""}` : x.status;
      if (v.done) { Object.assign(x, v.item); return; }
    } catch (e) {
      if (++misses > 60) { x.status = "❌ 等不到更新結果：" + e.message; x.failed = true; return; }
      x.status = x.target === "hub" ? "Hub 重新啟動中…" : "等待控制代理…";
      await new Promise(r => setTimeout(r, 3000));
    }
    renderItems();
  }
}
// 1.0.4 數據索引：容器（控制代理看到的）＋索引程式自己回報的進度
function indexCard(ix, c) {
  const k = "數據索引";
  if (c && c.status === "missing")
    return [k, `<span class="err">● 沒有容器</span>`, "先在數據集散地建 .qel 資料夾，再到 Container Manager → qelplatform →「建置」"];
  if (c && c.status && !c.running) {
    const why = c.error || (c.log || []).slice(-2).join(" ") || `結束碼 ${c.exit_code}`;
    return [k, `<span class="err">● ${esc(c.status === "restarting" ? "一直重新啟動" : "停止")}</span>`, esc(why).slice(0, 300)];
  }
  if (!ix.available) {
    const tail = c && (c.log || []).length ? `<br><span class="small">${esc(c.log.slice(-1)[0]).slice(0, 200)}</span>` : "";
    return [k, `<span class="${ix.phase === "error" ? "err" : "muted"}">● ${ix.phase === "installing" ? "安裝套件中" : ix.phase === "starting" ? "啟動中" : ix.phase === "error" ? "出錯" : "還沒有"}</span>`,
            esc(ix.message || "") + tail];
  }
  const key = ix.key_ok === false ? `<br><span class="err">讀檔程式拿不到鑰匙：數據集散地的 .qel 資料夾掛載有問題</span>` : "";
  if (ix.phase === "error") return [k, `<span class="err">● 出錯</span>`, esc(ix.error || "") + key];
  if (ix.state === "indexing" || ix.state === "listing")
    return [k, `${esc(ix.done ?? 0)} / ${esc(ix.todo ?? "…")}`, `索引中（共 ${esc(ix.files ?? "…")} 個檔，新的先做）` + key];
  const ago = ix.last_pass ? Math.max(0, Math.round((Date.now() / 1000 - ix.last_pass) / 60)) : null;
  return [k, `${esc(ix.indexed ?? 0)}`, `個檔已索引${ix.errors ? `（${esc(ix.errors)} 個讀不了）` : ""}${ago != null ? ` · ${ago} 分鐘前檢查` : ""}` + key];
}
async function loadStatus() {
  let s;
  try { s = await api("/api/platform/console/status"); } catch (e) { $("#sys").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const a = s.agent || {}, p = s.platform || {}, pl = p.paperlib || {}, d = s.disk;
  const pctFree = d ? Math.round(d.free / d.total * 100) : null;
  const nodesOn = (s.nodes || []).filter(n => n.online).length;
  $("#sys").innerHTML = [
    ["Hub", esc((s.hub || {}).version), "版本"],
    ["控制代理", a.online ? `<span class="ok">● 連線</span>` : `<span class="err">● 連不到</span>`, a.online ? `v${esc(a.version || "")}` : esc(a.error || "")],
    ["論文庫", pl.online ? `<span class="ok">● ${esc(pl.version || "連線")}</span>` : `<span class="err">● 連不到</span>`, pl.online ? "版本" : esc(pl.error || "")],
    ["NAS 空間", d ? `${size(d.free)}` : "—", d ? `剩 ${pctFree}%（共 ${size(d.total)}）` : ""],
    ["量測電腦", `${nodesOn} / ${(s.nodes || []).length}`, "線上 / 全部"],
    ["數據", esc(p.catalog ?? "—"), "筆"],
    ["登入中", esc(p.users_logged_in ?? "—"), "人"],
    indexCard(s.index || {}, a.online ? (a.indexer || null) : undefined),
  ].map(([k, v, sub]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="k">${sub}</div></div>`).join("");
  const ns = s.nodes || [];
  $("#nodes").innerHTML = ns.length ? `<table><tr><th>名稱</th><th>狀態</th><th>電腦</th><th>版本</th><th>量測</th></tr>${ns.map(n => {
    const r = n.run || {};
    return `<tr><td><span class="dot${n.online ? " on" : ""}"></span><b>${esc(n.name)}</b>${n.simulate ? ' <span class="small muted">模擬</span>' : ""}</td>
      <td>${n.online ? esc(STATE_ZH[n.state] || n.state) : "離線"}</td><td class="small">${esc(n.user || "")}@${esc(n.host || "")}</td>
      <td>${esc(n.version || "")}</td><td class="small">${r.name ? `${esc(r.name)}（${esc(r.by || "")}）${r.index ?? ""}/${r.total ?? ""}` : "—"}</td></tr>`; }).join("")}</table>`
    : `<div class="small muted">還沒有量測電腦上線。</div>`;
}

// ---- 路由 --------------------------------------------------------------------
async function route() {
  const h = location.hash || "#/";
  const [path, qs] = h.slice(1).split("?");
  const params = new URLSearchParams(qs || "");
  const v = {"/data": "data", "/projects": "projects", "/tags": "tags", "/admin": "admin", "/console": "console"}[path] || "home";
  document.querySelectorAll("#nav a.i").forEach(a => a.classList.toggle("on", a.dataset.v === (v === "data" ? "" : v)));
  try {
    if (v === "data") await viewData(params);
    else if (v === "tags") await viewTags(params);
    else if (v === "projects") await viewProjects(params);
    else if (v === "admin") await viewAdmin();
    else if (v === "console") await viewConsole();
    else viewHome();
  } catch (e) { $("#main").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

(async () => {
  try {
    ME = await api("/api/platform/me");
    const u = ME.user || {};
    // 1.0.7：導覽列由 Hub 產生（labhub/web_nav.py），站長才有控制台、帳號與權限
    await Promise.all([loadTags().catch(() => {}), loadProjects()]);
  } catch (e) { $("#main").innerHTML = `<div class="empty err">${esc(e.message)}</div>`; return; }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
