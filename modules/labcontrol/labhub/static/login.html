<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Control Hub</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1f2328; --muted:#6b7280; --border:#dfe3e8; --accent:#1971c2; --err:#e03131; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141517; --card:#1f2023; --text:#e9ecef; --muted:#9097a0; --border:#34373d; --accent:#4dabf7; --err:#ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font: 15px/1.5 "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; padding:16px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; width:100%; max-width:360px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 18px; font-size:13px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:transparent;
          color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { margin-top:14px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff;
           font-size:15px; font-weight:600; cursor:pointer; }
  .err { color:var(--err); font-size:13px; margin-top:10px; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>🛰 Lab Control Hub</h1>
  <p>輸入實驗室的存取 token（與 Lab Control 設定 <code>remote.token</code> 相同）。</p>
  <input name="token" type="password" autocomplete="current-password" placeholder="token" autofocus>
  <button type="submit">登入</button>
  <div class="err">{{error}}</div>
</form>
</body>
</html>
